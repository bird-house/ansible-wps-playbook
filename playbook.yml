---
# This Ansible playbook is used to deploy a PyWPS application.
- name: Install a PyWPS server
  hosts: web
  become: true

  pre_tasks:
    - name: Include vars from custom.yml if found
      include_vars: "{{ item }}"
      with_first_found:
        - custom.yml
        - null.yml
      tags:
        - always
  roles:
    - common
    - collectd
    - role: andrewrothstein.miniconda
      tags: conda
    - role: supervisor
      tags: supervisor
    - role: geerlingguy.supervisor
      tags: supervisor
    - role: geerlingguy.nginx
      tags: nginx
    - role: geerlingguy.postgresql
      when: db_install_postgresql
      tags: db
    - role: slurm
      when: slurm_enabled
    - role: galaxyproject.slurm
      when: slurm_enabled
    - role: pywps
      wps_webservice_enabled: true  # noqa var-naming[no-role-prefix]
    - role: wps_tools
      tags:
        - update
        - live_update
        - wps_tools
    - role: roocs
      when: roocs_enabled
      tags:
        - roocs
        - update

  tasks:
    - name: Reload systemd service definitions
      ansible.builtin.systemd:
        daemon_reload: true
      when: ansible_service_mgr == "systemd"
      tags:
        - always

- name: Install a PyWPS worker
  hosts: worker
  become: true

  pre_tasks:
    - name: Include vars from custom.yml if found
      include_vars: "{{ item }}"
      with_first_found:
        - custom.yml
        - null.yml
      tags:
        - always
  roles:
    - common
    - role: andrewrothstein.miniconda
      tags: conda
    - role: pywps
      wps_webservice_enabled: false  # noqa var-naming[no-role-prefix]
    - role: roocs
      when: roocs_enabled
      tags:
        - roocs
        - update
