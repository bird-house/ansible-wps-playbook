---
- name: Validate defaults and rendered configuration
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../group_vars/all.yml
    - ../roles/roocs/defaults/main.yml

  vars:
    ansible_fqdn: localhost
    ansible_default_ipv4:
      interface: eth0
    ansible_memtotal_mb: 64000
    test_primary_service:
      name: alpha
      hostname: alpha.example.test
      port: 5001
      mode: default
      environment:
        TEST_MODE: "true"
      extra_config: |
        [test]
        enabled = true
    test_secondary_service:
      name: beta
      hostname: beta.example.test
      port: 5002

  tasks:
    - name: Check retention conversions
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            (wps_outputs_keep_minutes | int) ==
            ((wps_outputs_keep_hours | int) * 60)
          - >-
            (wps_temp_keep_minutes | int) ==
            ((wps_temp_keep_hours | int) * 60)
          - wps_restart_schedule in ['hourly', 'daily']
          - wps_logrotate_min_size == '10M'
          - wps_logrotate_rotations == 7
          - wps_job_control_schedule | type_debug == 'dict'
          - wps_job_control_recovery_schedule | type_debug == 'dict'
          - wps_job_statistics_schedule | type_debug == 'dict'
          - wps_job_statistics_schedule.minute == '4'
          - wps_job_statistics_schedule.hour == '*'
          - wps_job_statistics_enabled
          - wps_job_inspect_schedule | type_debug == 'dict'
          - wps_job_inspect_schedule.minute == '2'
          - wps_job_inspect_schedule.hour == '*'
          - wps_job_inspect_enabled
          - wps_job_control_schedule.minute == '*/5'
          - wps_job_control_recovery_schedule.minute == '1-56/5'
          - wps_job_control_schedule.hour == '*'
          - job_long_running_minutes | float == 1
          - wps_job_control_long_running_minutes | float == 1
          - wps_job_control_stale_after_minutes | float == 30
          - wps_job_control_database_stale_after_minutes | float == 30
          - wps_job_control_database_status_window_hours | float == 24
          - >-
            wps_job_control_long_running_minutes | float
            < wps_job_control_stale_after_minutes | float
          - wps_job_control_recovery_limit | int == 100
          - wps_job_incident_archive_enabled
          - wps_job_incident_archive_dir == '/var/lib/pywps/job-incidents'
          - wps_job_incident_keep_days == 30
          - wps_job_incident_keep_minutes | int == 43200
          - >-
            wps_job_control_stale_after_minutes | float
            < wps_outputs_keep_minutes | float
          - wps_job_control_monitor_enabled
          - wps_job_control_recovery_enabled
          - wps_missing_status_recovery_enabled
          - wps_missing_status_poll_window_minutes == 60
          - wps_missing_status_min_poll_count == 3
          - wps_missing_status_min_poll_duration_minutes == 35
          - wps_missing_status_recovery_limit == 20
          - wps_missing_status_database_guard
          - conda_env_spec_file == 'linux-64.spec'
          - wps_conda_channel == 'conda-forge'
          - "'psycopg2=2.9.12' in wps_conda_packages"
          - "'drmaa=0.7.9' in wps_conda_packages"
          - "'gunicorn' in wps_conda_packages"
          - "'gevent' in wps_conda_packages"
          - wps_pip_packages == []
          - wps_cache_valid == '10m'
          - wps_health_cache_valid == '30s'
          - nginx_conf_path == '/etc/nginx/conf.d'
          - supervisor_config_path == '/etc/supervisor'
          - roocs_chunk_memory_limit == '128MiB'
          - roocs_file_size_limit == '2GB'
          - roocs_profile is none
          - roocs_project_path_defaults.cmip5 == '/data/cmip5'
          - roocs_project_path_defaults.cmip6 == '/data/CMIP6'
          - roocs_cmip5_path == '/data/cmip5'
          - roocs_cmip6_path == '/data/CMIP6'
          - "'dkrz' in roocs_project_path_profiles"
          - not slurm_configure_munge
          - slurm_system_memory_reserve_percent | int == 20
          - slurm_real_memory_mb | int == 51200
          - slurm_default_job_memory_mb | int == 12800
          - slurm_max_job_memory_mb | int == 51200
          - slurm_config.SchedulerType == 'sched/backfill'
          - slurm_config.SelectType == 'select/cons_res'
          - slurm_config.SelectTypeParameters == 'CR_Core_Memory'
          - slurm_config.ProctrackType == 'proctrack/cgroup'
          - slurm_config.TaskPlugin == 'task/affinity,task/cgroup'
          - slurm_config.JobAcctGatherType == 'jobacct_gather/cgroup'
          - slurm_cgroup_config.ConstrainCores
          - slurm_cgroup_config.ConstrainRAMSpace
          - slurm_cgroup_config.ConstrainSwapSpace
          - slurm_cgroup_config.AllowedRAMSpace | int == 100
          - slurm_cgroup_config.AllowedSwapSpace | int == 0
          - slurm_nodes[0].RealMemory | int == 51200
          - slurm_partitions[0].DefMemPerNode | int == 12800
          - slurm_partitions[0].MaxMemPerNode | int == 51200
          - slurm_job_timeout_minutes | int == 25
          - slurm_partitions[0].DefaultTime | int == 25
          - slurm_partitions[0].MaxTime | int == 25
          - >-
            slurm_job_timeout_minutes | int
            < wps_job_control_stale_after_minutes | float
          - >-
            slurm_job_timeout_minutes | int
            < wps_job_control_database_stale_after_minutes | float
          - slurm_job_monitor_enabled
          - slurm_job_monitor_schedule.minute == '*/5'
          - slurm_job_monitor_user == 'wps'
          - slurm_job_monitor_long_running_minutes | int == 1
          - slurm_job_monitor_pending_critical == 20
          - slurm_job_monitor_script == '/usr/local/sbin/slurm-job-monitor'
          - slurm_job_status_script == '/var/lib/pywps/slurm-job-status.py'
          - slurm_top_script == '/var/lib/pywps/slurm-top'
          - slurm_job_monitor_lock_file == '/run/lock/slurm-job-monitor.lock'
          - >-
            slurm_job_monitor_log_file
            == '/var/log/pywps/slurm-job-monitor.log'
          - >-
            slurm_job_monitor_alert_file
            == '/run/pywps/slurm-red-alert.json'
          - collectd_enabled
          - collectd_load_enabled
          - not collectd_disk_enabled
          - collectd_disk_mount == '/mnt/ext_pywps_outputs'
          - collectd_memory_enabled
          - collectd_interface_enabled
          - collectd_interval == 60
          - collectd_cleanup_enabled
          - collectd_cleanup_schedule == '*-*-* 00:30:00'
          - collectd_compress_after_days == 7
          - collectd_keep_days == 30
          - collectd_compress_after_days < collectd_keep_days
          - collectd_summary_enabled
          - collectd_summary_schedule == '*-*-* 00:10:00'
          - collectd_summary_output == '/var/log/collectd-daily-summary.log'
          - collectd_hourly_summary_enabled
          - collectd_hourly_summary_schedule == '*-*-* *:05:00'
          - >-
            collectd_hourly_summary_output
            == '/var/log/collectd-hourly-summary.log'

    - name: Render primary service configuration
      ansible.builtin.set_fact:
        test_pywps_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/pywps.cfg.j2') }}
        test_gunicorn_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/gunicorn.py.j2') }}
        test_supervisor_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/supervisor.conf.j2') }}
        test_run_script: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/run.sh.j2') }}
        test_restart_script: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/restart-pywps.sh.j2') }}
        test_smoke_script: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/smoke.sh.j2') }}
        test_job_control_helper: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/pywps/templates/job-control-helper.sh.j2') }}
        test_db_monitor_helper: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/pywps/templates/db-monitor-helper.sh.j2') }}
        test_request_insights_helper: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/pywps/templates/request-insights-helper.sh.j2') }}
        test_slurm_top: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/pywps/templates/slurm-top.sh.j2') }}
        test_logrotate_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/logrotate.j2') }}
        test_nginx_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/nginx.conf.j2') }}
        test_collectd_load_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/collectd/templates/collectd.conf.j2') }}
        test_collectd_cleanup_service: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/collectd/templates/collectd-cleanup.service.j2') }}
        test_collectd_cleanup_timer: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/collectd/templates/collectd-cleanup.timer.j2') }}
        test_collectd_summary_load_service: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/collectd/templates/collectd-daily-summary.service.j2') }}
        test_collectd_summary_timer: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/collectd/templates/collectd-daily-summary.timer.j2') }}
        test_collectd_hourly_summary_load_service: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/collectd/templates/collectd-hourly-summary.service.j2') }}
        test_collectd_hourly_summary_timer: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/collectd/templates/collectd-hourly-summary.timer.j2') }}
      vars:
        item: "{{ test_primary_service }}"
        wps_enable_https: true
        wps_enable_acl: true
        wps_acl_allow:
          - 192.0.2.0/24
        slurm_enabled: false

    - name: Render collectd configuration with all metrics
      ansible.builtin.set_fact:
        test_collectd_all_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/collectd/templates/collectd.conf.j2') }}
        test_collectd_summary_all_service: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/collectd/templates/collectd-daily-summary.service.j2') }}
        test_collectd_hourly_summary_all_service: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/collectd/templates/collectd-hourly-summary.service.j2') }}
      vars:
        collectd_disk_enabled: true
        collectd_memory_enabled: true
        collectd_interface_enabled: true
        collectd_interface: ens3

    - name: Render Slurm service launcher
      ansible.builtin.set_fact:
        test_slurm_run_script: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/run.sh.j2') }}
        test_slurm_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/galaxyproject.slurm/templates/slurm.conf.j2') }}
      vars:
        item: "{{ test_primary_service }}"
        slurm_enabled: true
        __slurm_config_merged: "{{ slurm_config }}"

    - name: Render alternate configuration
      ansible.builtin.set_fact:
        test_sqlite_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/pywps.cfg.j2') }}
        test_secondary_nginx_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/nginx.conf.j2') }}
        test_fileserver_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/pywps/templates/nginx_fs.conf.j2') }}
        test_roocs_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/roocs/templates/roocs.ini.j2') }}
      vars:
        item: "{{ test_secondary_service }}"
        db_install_sqlite: true
        fs_enabled: true
        fs_host: files.example.test
        fs_port: 6000
        roocs_profile: dkrz
        roocs_cmip6_path: /test/dkrz/CMIP6
        wps_cache_valid: 5m
        wps_health_cache_valid: 15s

    - name: Render Slurm cgroup configuration
      ansible.builtin.set_fact:
        test_slurm_cgroup_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir
                    + '/../roles/galaxyproject.slurm/templates/generic.conf.j2') }}
      vars:
        item:
          config: slurm_cgroup_config

    - name: Check rendered primary service configuration
      ansible.builtin.assert:
        quiet: true
        that:
          - "'url = https://alpha.example.test:5001/wps' in test_pywps_config"
          - "'database = postgresql+psycopg2://' in test_pywps_config"
          - "'[test]' in test_pywps_config"
          - "'enabled = true' in test_pywps_config"
          - "'unix:///run/pywps/alpha.sock' in test_gunicorn_config"
          - "'graceful_timeout = 30' in test_gunicorn_config"
          - "'max_requests = 1000' in test_gunicorn_config"
          - "'max_requests_jitter = 100' in test_gunicorn_config"
          - "'TEST_MODE=true' in test_gunicorn_config"
          - "'[program:alpha]' in test_supervisor_config"
          - "'autorestart=unexpected' in test_supervisor_config"
          - "'stopsignal=TERM' in test_supervisor_config"
          - "'stopwaitsecs=40' in test_supervisor_config"
          - "'killasgroup=true' in test_supervisor_config"
          - "'exec gunicorn -c /etc/gunicorn/alpha.py' in test_run_script"
          - "'DRMAA_LIBRARY_PATH' not in test_run_script"
          - >-
            'export DRMAA_LIBRARY_PATH=/usr/local/anaconda/envs/alpha/lib/libdrmaa.so'
            in test_slurm_run_script
          - >-
            'PartitionName=fast Default=YES DefaultTime=25 DefMemPerNode=12800 '
            'MaxMemPerNode=51200 MaxTime=25 Nodes=localhost'
            in test_slurm_config
          - >-
            'NodeName=localhost CPUs=4 RealMemory=51200'
            in test_slurm_config
          - "'AllowedRAMSpace=100' in test_slurm_cgroup_config"
          - "'AllowedSwapSpace=0' in test_slurm_cgroup_config"
          - "'ConstrainCores=yes' in test_slurm_cgroup_config"
          - "'ConstrainRAMSpace=yes' in test_slurm_cgroup_config"
          - "'ConstrainSwapSpace=yes' in test_slurm_cgroup_config"
          - "'set -euo pipefail' in test_restart_script"
          - "'supervisorctl restart \"$app\"' in test_restart_script"
          - "'kill $gunicorn_pids' not in test_restart_script"
          - "'Found orphaned or zombie Gunicorn processes' in test_restart_script"
          - "'cleanup_orphaned_processes=false' in test_restart_script"
          - "'restart_enabled=true' in test_restart_script"
          - "'restart-pywps [--force] SERVICE_NAME' in test_restart_script"
          - "'Sending TERM to orphaned Gunicorn process' in test_restart_script"
          - "'set -euo pipefail' in test_smoke_script"
          - "'local app_dir=\"/usr/local/src/$app\"' in test_smoke_script"
          - "'exec \"$pytest\" -v -k smoke \"$smoke_tests\"' in test_smoke_script"
          - "'monitor)' in test_job_control_helper"
          - "'recover)' in test_job_control_helper"
          - "'mode=recover' in test_job_control_helper"
          - "'statistics)' in test_job_control_helper"
          - "'mode=statistics' in test_job_control_helper"
          - "'script_options=(--layer' not in test_job_control_helper"
          - "'--status-counts' not in test_job_control_helper"
          - test_job_control_helper.count('script_options=(--show-summaries)') == 3
          - >-
            'exec "$python" "$job_control_script"'
            in test_job_control_helper
          - "'request-insights SERVICE_NAME' in test_request_insights_helper"
          - >-
            'logs=("/var/log/pywps/$service-requests.log"*)'
            in test_request_insights_helper
          - >-
            '--config "$config_file" "$mode" "${script_options[@]}" "$@"'
            in test_job_control_helper
          - >-
            '$command_name has a fixed layer scope; --layer is not allowed'
            in test_job_control_helper
          - "'db-monitor SERVICE_NAME [[START][/END]]' in test_db_monitor_helper"
          - >-
            'monitor_script="/var/lib/pywps/pywps-db-monitor.py"'
            in test_db_monitor_helper
          - >-
            'exec "$python" "$monitor_script"'
            in test_db_monitor_helper
          - >-
            '--config "$config_file" "${range_option[@]}" "$@"'
            in test_db_monitor_helper
          - "'status_script=\"/var/lib/pywps/slurm-job-status.py\"' in test_slurm_top"
          - "'status_options=(--user \"wps\")' in test_slurm_top"
          - >-
            'exec watch -n "$interval" -- "$status_script"'
            in test_slurm_top
          - "'rotate 7' in test_logrotate_config"
          - "'daily' in test_logrotate_config"
          - "'minsize 10M' in test_logrotate_config"
          - "'maxsize' not in test_logrotate_config"
          - "'upstream alpha' in test_nginx_config"
          - "'proxy_cache_path /var/lib/pywps/cache/alpha' in test_nginx_config"
          - "'keys_zone=pywps_alpha:10m' in test_nginx_config"
          - "'map $arg_request $pywps_alpha_nocache' in test_nginx_config"
          - "'map $arg_request $pywps_alpha_deny' in test_nginx_config"
          - "'proxy_cache             pywps_alpha;' in test_nginx_config"
          - "'listen                 5001 ssl http2 default_server;' in test_nginx_config"
          - "'allow 192.0.2.0/24;' in test_nginx_config"
          - "'location = /health' in test_nginx_config"
          - >-
            test_nginx_config.count('proxy_cache           pywps_alpha;') == 2
          - >-
            test_nginx_config.count('proxy_cache_key       $scheme$proxy_host$uri;') == 2
          - >-
            test_nginx_config.count('proxy_cache_valid     200 30s;') == 2
          - >-
            test_nginx_config.count('proxy_cache_lock      on;') == 2
          - >-
            test_nginx_config.count('proxy_cache_lock_age  60s;') == 2
          - >-
            test_nginx_config.count('proxy_cache_lock_timeout 60s;') == 2
          - "'proxy_cache_valid       200 10m;' in test_nginx_config"
          - >-
            'proxy_pass            http://alpha/wps?service=WPS&request=GetCapabilities;'
            in test_nginx_config
          - "'location = /health2' in test_nginx_config"
          - >-
            'proxy_pass            http://alpha/wps?service=WPS&version=1.0.0&request=Execute&identifier=health&RawDataOutput=status;'
            in test_nginx_config
          - "'[job_control]' in test_pywps_config"
          - "'[stalled_jobs]' not in test_pywps_config"
          - "'service_name' not in test_pywps_config"
          - "'monitor_enabled = true' in test_pywps_config"
          - "'recovery_enabled = true' in test_pywps_config"
          - "'missing_status_recovery_enabled = true' in test_pywps_config"
          - "'statistics_enabled = true' in test_pywps_config"
          - "'layers =' not in test_pywps_config"
          - "'long_running_minutes = 1' in test_pywps_config"
          - "'stale_after_minutes = 30' in test_pywps_config"
          - "'database_stale_after_minutes = 30' in test_pywps_config"
          - "'database_status_window_hours = 24' in test_pywps_config"
          - "'recovery_user = wps' in test_pywps_config"
          - "'recovery_group = wps' in test_pywps_config"
          - >-
            'python_executable = /usr/local/anaconda/envs/alpha/bin/python'
            in test_pywps_config
          - >-
            'recovery_working_dir = /usr/local/src/alpha'
            in test_pywps_config
          - "'recovery_limit = 100' in test_pywps_config"
          - "'incident_archive_enabled = true' in test_pywps_config"
          - >-
            'incident_archive_dir = /var/lib/pywps/job-incidents/alpha'
            in test_pywps_config
          - "'missing_status_recovery_limit = 20' in test_pywps_config"
          - "'LoadPlugin load' in test_collectd_load_config"
          - "'LoadPlugin df' not in test_collectd_load_config"
          - "'LoadPlugin memory' in test_collectd_load_config"
          - "'LoadPlugin interface' in test_collectd_load_config"
          - "'StoreRates false' in test_collectd_load_config"
          - "'LoadPlugin load' in test_collectd_all_config"
          - "'LoadPlugin df' in test_collectd_all_config"
          - "'MountPoint \"/mnt/ext_pywps_outputs\"' in test_collectd_all_config"
          - "'ValuesPercentage true' in test_collectd_all_config"
          - "'LoadPlugin memory' in test_collectd_all_config"
          - "'LoadPlugin interface' in test_collectd_all_config"
          - "'Interface \"ens3\"' in test_collectd_all_config"
          - >-
            'ExecStart=/usr/local/sbin/collectd-cleanup'
            in test_collectd_cleanup_service
          - >-
            '--csv-dir /var/lib/collectd/csv/localhost'
            in test_collectd_cleanup_service
          - >-
            '--compress-after-days 7 --keep-days 30'
            in test_collectd_cleanup_service
          - "'ProtectSystem=strict' in test_collectd_cleanup_service"
          - >-
            'ReadWritePaths=/var/lib/collectd/csv/localhost'
            in test_collectd_cleanup_service
          - "'OnCalendar=*-*-* 00:30:00' in test_collectd_cleanup_timer"
          - "'Persistent=true' in test_collectd_cleanup_timer"
          - "'--load' in test_collectd_summary_load_service"
          - "'--disk-mount' not in test_collectd_summary_load_service"
          - "'--memory' in test_collectd_summary_load_service"
          - "'--interface eth0' in test_collectd_summary_load_service"
          - >-
            '--output /var/log/collectd-daily-summary.log'
            in test_collectd_summary_load_service
          - "'--load' in test_collectd_summary_all_service"
          - >-
            '--disk-mount /mnt/ext_pywps_outputs'
            in test_collectd_summary_all_service
          - "'--memory' in test_collectd_summary_all_service"
          - "'--interface ens3' in test_collectd_summary_all_service"
          - "'OnCalendar=*-*-* 00:10:00' in test_collectd_summary_timer"
          - "'Persistent=true' in test_collectd_summary_timer"
          - >-
            '--period hourly' in test_collectd_hourly_summary_load_service
          - "'--load' in test_collectd_hourly_summary_load_service"
          - >-
            '--output /var/log/collectd-hourly-summary.log'
            in test_collectd_hourly_summary_load_service
          - "'--disk-mount' not in test_collectd_hourly_summary_load_service"
          - "'--memory' in test_collectd_hourly_summary_load_service"
          - "'--interface eth0' in test_collectd_hourly_summary_load_service"
          - >-
            '--disk-mount /mnt/ext_pywps_outputs'
