---
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ansible-wps-playbook
          environment-file: environment.yml
          miniforge-version: latest
          conda-remove-defaults: "true"

      - name: Install pinned Ansible dependencies
        run: make roles

      - name: Lint YAML and Ansible
        run: make lint

  configuration:
    name: Syntax and configuration
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ansible-wps-playbook
          environment-file: environment.yml
          miniforge-version: latest
          conda-remove-defaults: "true"

      - name: Install pinned Ansible dependencies
        run: make roles

      - name: Check playbook syntax
        run: make check

      - name: Validate defaults and rendered configuration
        run: make smoke
