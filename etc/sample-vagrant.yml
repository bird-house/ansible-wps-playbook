---
server_name: 192.168.128.100
# Conda spec
conda_env_use_spec: true
# slurm
slurm_enabled: yes
# Configuration for Emu WPS
wps_services:
  - name: emu
    repo: https://github.com/bird-house/emu.git
    version: master
    hostname: "{{ server_name }}"
    port: 80
    mode: scheduler
    maxprocesses: -1
    parallelprocesses: -1
