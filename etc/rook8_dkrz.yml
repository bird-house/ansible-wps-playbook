---
wps_internal_hostname: rook8.cloud.dkrz.de
# wps_external_hostname: compute.mips.copernicus-climate.eu
wps_external_hostname: rook8.cloud.dkrz.de

# service user
service_user: tomcat
service_uid: 401
service_group: tomcat
service_gid: 399

# enable cronjob to clean outputs
cron_mailto: ehbrecht@dkrz.de
cron_enabled: yes
# conda
conda_env_use_spec: true
# slurm
slurm_enabled: true
slurm_cpus: 8
# Rook workers commonly need 15-18 GiB. With roughly 64 GiB installed and the
# default 20% system reserve, this admits two ordinary workers at a time while
# retaining two CPUs for Gunicorn and other host services.
# slurm_default_job_memory_mb: 4000
# access control
wps_enable_acl: true
wps_acl_allow:
   - 136.172.0.0/16   # dkrz
   - 136.156.0.0/16   # cds
# roocs
roocs_enabled: true
roocs_profile: dkrz
# collectd
collectd_disk_enabled: true
collectd_disk_mount: /mnt/rook_disk8
wps_services:
  - name: rook
    repo: https://github.com/roocs/rook.git
    version: v1.4.0
    # version: main
    hostname: "{{ wps_external_hostname }}"
    fs_hostname: "{{ wps_internal_hostname }}"
    port: 80
    mode: scheduler
    # drmaa_native_specification: "--share -N 1-2"
    maxprocesses: -1
    parallelprocesses: -1
    storage_copy_function: link
    log_level: INFO
    identification_accessconstraints: "open access"
    provider_name: "rook8 (DKRZ)"
    provider_url: https://roocs.github.io/
    contact_name: DKRZ
    contact_city: Hamburg
    contact_country: Germany
    contact_url: https://roocs.github.io/
    cleantempdir: false
    environment:
      INTAKE_CONF_DIR: /var/lib/pywps/intake
