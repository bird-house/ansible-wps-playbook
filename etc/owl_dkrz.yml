---
# enable cronjob to clean outputs
cron_mailto: ehbrecht@dkrz.de
cron_enabled: yes
# conda
conda_env_use_spec: true
conda_env_spec_file: spec-list.txt
# slurm
slurm_enabled: yes
# Configuration for Albatross WPS
wps_services:
  - name: owl
    repo: https://github.com/climateintelligence/owl.git
    version: main
    hostname: owl1.cloud.dkrz.de
    port: 80
    mode: scheduler
    maxprocesses: -1
    parallelprocesses: -1
    storage_copy_function: link
    log_level: INFO
    provider_name: CLINT
    provider_url: https://climateintelligence.eu/
