---
- name: Install Slurm build and authentication prerequisites
  ansible.builtin.package:
    name:
      - munge
      - slurm-devel
    state: present

- name: Configure Munge directories
  ansible.builtin.file:
    path: /var/log/munge
    state: directory
    owner: munge
    group: munge
    mode: "0700"

- name: Generate munge key
  ansible.builtin.command: create-munge-key
  args:
    creates: "{{ slurm_munge_key }}"

- name: Secure munge key
  ansible.builtin.file:
    path: "{{ slurm_munge_key }}"
    state: file
    owner: munge
    group: munge
    mode: "0400"

- name: Enable and start Munge
  ansible.builtin.service:
    name: munge
    enabled: true
    state: started
