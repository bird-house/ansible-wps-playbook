---
- name: Create links to supervisor bin
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: /usr/local/bin/supervisord, dest: /usr/bin/supervisord }
    - { src: /usr/local/bin/supervisorctl, dest: /usr/bin/supervisorctl }
  when:
    - ansible_os_family == "RedHat"
