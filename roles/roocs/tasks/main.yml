---
- name: Validate selected ROOCS path profile
  ansible.builtin.assert:
    that:
      - roocs_project_path_profiles is mapping
      - >-
        roocs_profile is none
        or (roocs_profile is string
            and roocs_profile in roocs_project_path_profiles)
    fail_msg: >-
      Unknown ROOCS path profile '{{ roocs_profile }}'. Available profiles:
      {{ roocs_project_path_profiles.keys() | sort | join(', ') }}.
  tags:
    - live_update

- name: Validate ROOCS project paths
  ansible.builtin.assert:
    that:
      - item.value is string
      - item.value | length > 0
    fail_msg: "ROOCS project path '{{ item.key }}' must be a non-empty string."
  loop: "{{ roocs_paths_to_validate | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    roocs_paths_to_validate:
      cmip5: "{{ roocs_cmip5_path }}"
      cmip6: "{{ roocs_cmip6_path }}"
      cordex: "{{ roocs_cordex_path }}"
      c3s_cmip5: "{{ roocs_c3s_cmip5_path }}"
      c3s_cmip6: "{{ roocs_c3s_cmip6_path }}"
      c3s_cmip6_decadal: "{{ roocs_c3s_cmip6_decadal_path }}"
      c3s_cordex: "{{ roocs_c3s_cordex_path }}"
      c3s_ipcc_atlas: "{{ roocs_c3s_ipcc_atlas_path }}"
      c3s_cica_atlas: "{{ roocs_c3s_cica_atlas_path }}"
      copernicus_interactive_climate_atlas: >-
        {{ roocs_copernicus_interactive_climate_atlas_path }}
  tags:
    - live_update

- name: Validate ROOCS memory and file-size limits
  ansible.builtin.assert:
    that:
      - roocs_chunk_memory_limit is string
      - >-
        roocs_chunk_memory_limit
        is match('^[1-9][0-9]* ?(KiB|MiB|GiB|KB|MB|GB)$')
      - roocs_file_size_limit is string
      - >-
        roocs_file_size_limit
        is match('^[1-9][0-9]* ?(KiB|MiB|GiB|KB|MB|GB)$')
      - roocs_batch_memory_limit is string
      - >-
        roocs_batch_memory_limit
        is match('^[1-9][0-9]* ?(KiB|MiB|GiB|KB|MB|GB)$')
    fail_msg: >-
      roocs_chunk_memory_limit, roocs_file_size_limit, and
      roocs_batch_memory_limit must be positive integer sizes such as
      128MiB, 2GB, or 4096MB.
  tags:
    - live_update

- name: Clean roocs cache dir
  file:
    state: absent
    path: "{{ roocs_cache_dir }}/"

- name: Copy roocs config
  template:
    src: "./templates/roocs.ini.j2"
    dest: "/etc/roocs.ini"
    owner: root
    group: "{{ wps_group }}"
    mode: "0640"
  tags:
    - live_update
