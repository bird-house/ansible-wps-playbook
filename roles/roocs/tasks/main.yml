---
- name: Validate ROOCS read and write limits
  ansible.builtin.assert:
    that:
      - roocs_chunk_memory_limit is string
      - >-
        roocs_chunk_memory_limit
        is match('^[1-9][0-9]* ?(KiB|MiB|GiB|KB|MB|GB)$')
      - roocs_file_size_limit is string
      - >-
        roocs_file_size_limit
        is match('^[1-9][0-9]* ?(KiB|MiB|GiB|KB|MB|GB)$')
    fail_msg: >-
      roocs_chunk_memory_limit and roocs_file_size_limit must be positive
      integer sizes such as 256MiB or 1GB.
  when: roocs_site == "dkrz"

- name: Clone test data.
  git:
    repo: "https://github.com/roocs/mini-esgf-data.git"
    version: "master"
    dest: "{{ roocs_demo_data_dir }}/mini-esgf-data"
    update: true
    force: true
  run_once: true
  when: roocs_site == "demo"

- name: Clean roocs cache dir
  file:
    state: absent
    path: "{{ roocs_cache_dir }}/"

- name: Copy roocs config
  template:
    src: "./templates/roocs.{{ roocs_site }}.ini.j2"
    dest: "/etc/roocs.ini"
    owner: root
    group: "{{ wps_group }}"
    mode: "0640"
