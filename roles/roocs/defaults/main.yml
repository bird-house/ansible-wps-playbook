---
# Profiles contain only local data-pool paths. The ROOCS project semantics stay
# in the single version-coupled template.
roocs_project_path_profiles:
  dkrz:
    cmip5: /mnt/lustre/work/kd0956/CMIP5/data/cmip5
    cmip6: /mnt/lustre/work/ik1017/CMIP6/data/CMIP6
    cordex: /mnt/lustre/work/ik1017/CORDEX/data/cordex
    c3s_cmip5: /mnt/lustre/work/ik1017/C3SCMIP5/data/c3s-cmip5
    c3s_cmip6: /mnt/lustre/work/ik1017/CMIP6/data/CMIP6
    c3s_cmip6_decadal: /mnt/lustre/work/ik1017/CMIP6/data/CMIP6
    c3s_cordex: /mnt/lustre/work/ik1017/C3SCORDEX/data/c3s-cordex
    c3s_ipcc_atlas: /mnt/lustre/work/ik1017/C3SATLAS/data/c3s-ipcc-ar6-atlas
    c3s_cica_atlas: /mnt/lustre/work/ik1017/Ingest/C3S-CICA-ATLAS
    copernicus_interactive_climate_atlas: >-
      /mnt/lustre/work/ik1017/Ingest/C3S-CICA-ATLAS

# Direct inventory values have higher precedence than these role defaults.
# Without a selected profile, use a conventional /data layout.
roocs_cmip5_path: >-
  {{ roocs_project_path_profiles.get(roocs_profile, {}).get('cmip5', '/data/cmip5') }}
roocs_cmip6_path: >-
  {{ roocs_project_path_profiles.get(roocs_profile, {}).get('cmip6', '/data/CMIP6') }}
roocs_cordex_path: >-
  {{ roocs_project_path_profiles.get(roocs_profile, {}).get('cordex', '/data/cordex') }}
roocs_c3s_cmip5_path: >-
  {{ roocs_project_path_profiles.get(roocs_profile, {}).get('c3s_cmip5', '/data/c3s-cmip5') }}
roocs_c3s_cmip6_path: >-
  {{ roocs_project_path_profiles.get(roocs_profile, {}).get('c3s_cmip6', '/data/CMIP6') }}
roocs_c3s_cmip6_decadal_path: >-
  {{ roocs_project_path_profiles.get(roocs_profile, {}).get('c3s_cmip6_decadal', '/data/CMIP6') }}
roocs_c3s_cordex_path: >-
  {{ roocs_project_path_profiles.get(roocs_profile, {}).get('c3s_cordex', '/data/c3s-cordex') }}
roocs_c3s_ipcc_atlas_path: >-
  {{ roocs_project_path_profiles.get(roocs_profile, {}).get('c3s_ipcc_atlas', '/data/c3s-ipcc-ar6-atlas') }}
roocs_c3s_cica_atlas_path: >-
  {{ roocs_project_path_profiles.get(roocs_profile, {}).get('c3s_cica_atlas', '/data/C3S-CICA-ATLAS') }}
roocs_copernicus_interactive_climate_atlas_path: >-
  {{ roocs_project_path_profiles.get(roocs_profile, {}).get('copernicus_interactive_climate_atlas', '/data/C3S-CICA-ATLAS') }}
