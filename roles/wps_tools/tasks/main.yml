---
- name: Add MAILTO to PyWPS cron file
  community.general.cronvar:
    name: MAILTO
    value: "{{ cron_mailto }}"
    cron_file: ansible_pywps

- name: Clear PyWPS output directories
  ansible.builtin.cron:
    name: "clear wps outputs"
    minute: "3"
    hour: "*"
    user: "{{ cron_user }}"
    job: >-
      find {{ wps_basedir }}/outputs -mindepth 2 -maxdepth 2
      -ignore_readdir_race -type d
      -mmin +{{ wps_outputs_keep_minutes }} -regextype sed
      -regex ".*/[a-f0-9\-]\{36\}$"
      -prune -exec rm -rf -- {} \;
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Clear PyWPS status documents
  ansible.builtin.cron:
    name: "clear wps status"
    minute: "3"
    hour: "*"
    user: "{{ cron_user }}"
    job: >-
      find {{ wps_basedir }}/outputs -mindepth 2 -maxdepth 2
      -ignore_readdir_race -type f
      -mmin +{{ wps_outputs_keep_minutes }} -regextype sed
      -regex ".*/[a-f0-9\-]\{36\}\.xml$" -delete
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Clear PyWPS temporary process directories
  ansible.builtin.cron:
    name: "clear wps tempfiles"
    minute: "3"
    hour: "*"
    user: "{{ cron_user }}"
    job: >-
      find {{ wps_basedir }}/tmp -mindepth 2 -maxdepth 2
      -ignore_readdir_race -type d
      -mmin +{{ wps_temp_keep_minutes }} -name "pywps_process_*"
      -prune -exec rm -rf -- {} \;
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Create PyWPS tool directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ wps_tools_dir }}"
    - "{{ wps_tools_bin_dir }}"
    - "{{ wps_tools_sbin_dir }}"
    - "{{ wps_tools_script_dir }}"

- name: Create PyWPS state directory
  ansible.builtin.file:
    path: "{{ wps_tools_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create WPS statistics directory
  ansible.builtin.file:
    path: "{{ wps_tools_statistics_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Validate job-control settings
  ansible.builtin.assert:
    that:
      - wps_tools_dir is match('^/')
      - wps_tools_state_dir is match('^/')
      - wps_tools_dir != service_user_home
      - wps_tools_bin_dir.startswith(wps_tools_dir + '/')
      - wps_tools_sbin_dir.startswith(wps_tools_dir + '/')
      - wps_tools_script_dir.startswith(wps_tools_dir + '/')
      - wps_tools_pywps_status_script.startswith(wps_tools_script_dir + '/')
      - wps_tools_pywps_top_script.startswith(wps_tools_bin_dir + '/')
      - wps_tools_state_dir.startswith(service_user_home + '/')
      - wps_tools_statistics_dir.startswith(service_user_home + '/')
      - wps_tools_event_keep_days | int > 0
      - wps_tools_statistics_keep_days | int >= 0
      - wps_tools_job_control_schedule | type_debug == 'dict'
      - wps_tools_job_control_recovery_schedule | type_debug == 'dict'
      - wps_tools_statistics_schedule | type_debug == 'dict'
      - wps_tools_inspect_schedule | type_debug == 'dict'
      - job_timeout_minutes | float > 0
      - job_timeout_grace_minutes | float > 0
      - wps_tools_job_control_long_running_minutes | float > 0
      - wps_tools_job_control_stale_after_minutes | float > 0
      - wps_tools_job_control_database_stale_after_minutes | float > 0
      - wps_tools_job_control_database_status_window_hours | float >= 3
      - wps_tools_job_control_database_status_window_hours | float <= 24
      - >-
        (wps_tools_job_control_long_running_minutes | float)
        < (wps_tools_job_control_stale_after_minutes | float)
      - >-
        (wps_tools_job_control_long_running_minutes | float)
        < (wps_tools_job_control_database_stale_after_minutes | float)
      - wps_tools_job_control_recovery_limit | int > 0
      - wps_tools_incident_keep_days | int > 0
      - wps_tools_incident_keep_minutes | int > 0
      - wps_tools_incident_archive_dir | length > 0
      - >-
        not (wps_tools_job_control_recovery_enabled | bool)
        or (wps_tools_incident_archive_enabled | bool)
      - wps_tools_missing_status_poll_window_minutes | float > 0
      - wps_tools_missing_status_min_poll_count | int > 0
      - wps_tools_missing_status_min_poll_duration_minutes | float >= 0
      - >-
        (wps_tools_missing_status_min_poll_duration_minutes | float)
        < (wps_tools_missing_status_poll_window_minutes | float)
      - wps_tools_missing_status_recovery_limit | int > 0
      - >-
        not (cron_enabled | bool)
        or not (wps_tools_job_control_monitor_enabled | bool)
        or (wps_tools_job_control_stale_after_minutes | float) < (wps_outputs_keep_minutes | float)
    fail_msg: >-
      PyWPS tool and state paths must be absolute, distinct, and nested below
      their configured base directories. The job-control schedule must be a
      cron-field mapping. The shared job timeout and recovery grace must be
      positive, and recovery age must be positive and shorter than output
      retention for scheduled XML checks.
      The long-running warning must be positive and shorter than the stale
      threshold, the database status window must be between 3 and 24 hours,
      and recovery and incident-retention limits must be positive.
      Recovery requires incident archiving so the source XML and scheduler
      dump can be preserved before PyWPS updates them.
      Missing-status recovery also requires a positive polling window, poll
      count and recovery limit, and a minimum poll duration shorter than its
      polling window.

- name: Install PyWPS job-control script
  ansible.builtin.copy:
    src: pywps-job-control.py
    dest: "{{ wps_tools_script_dir }}/pywps-job-control.py"
    owner: root
    group: root
    mode: "0755"

- name: Install WPS event utilities
  ansible.builtin.copy:
    src: wps_tools_events.py
    dest: "{{ wps_tools_script_dir }}/wps_tools_events.py"
    owner: root
    group: root
    mode: "0644"

- name: Install WPS event statistics script
  ansible.builtin.copy:
    src: wps-event-statistics.py
    dest: "{{ wps_tools_script_dir }}/wps-event-statistics.py"
    owner: root
    group: root
    mode: "0755"

- name: Install PyWPS database report script
  ansible.builtin.copy:
    src: pywps-db-report.py
    dest: "{{ wps_tools_script_dir }}/pywps-db-report.py"
    owner: root
    group: root
    mode: "0755"

- name: Install PyWPS database report command
  ansible.builtin.template:
    src: db-report-helper.sh.j2
    dest: "{{ wps_tools_sbin_dir }}/db-report"
    owner: root
    group: root
    mode: "0755"

- name: Install interactive PyWPS database status script
  ansible.builtin.copy:
    src: pywps-job-status.py
    dest: "{{ wps_tools_pywps_status_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Install PyWPS database live-view shortcut
  ansible.builtin.template:
    src: pywps-top.sh.j2
    dest: "{{ wps_tools_pywps_top_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Remove obsolete database monitor shortcut
  ansible.builtin.file:
    path: "{{ wps_tools_bin_dir }}/db-monitor"
    state: absent

- name: Remove obsolete database monitor script
  ansible.builtin.file:
    path: "{{ wps_tools_script_dir }}/pywps-db-monitor.py"
    state: absent

- name: Install PyWPS XML inspection script
  ansible.builtin.copy:
    src: pywps-xml-inspect.py
    dest: "{{ wps_tools_script_dir }}/pywps-xml-inspect.py"
    owner: root
    group: root
    mode: "0755"

- name: Remove obsolete XML inspection shortcut
  ansible.builtin.file:
    path: "{{ wps_tools_bin_dir }}/inspect-jobs"
    state: absent

- name: Install PyWPS request-insights script
  ansible.builtin.copy:
    src: pywps-request-insights.py
    dest: "{{ wps_tools_script_dir }}/pywps-request-insights.py"
    owner: root
    group: root
    mode: "0755"

- name: Remove legacy PyWPS request-insights command
  ansible.builtin.file:
    path: "{{ wps_tools_bin_dir }}/request-insights"
    state: absent

- name: Install PyWPS insights command
  ansible.builtin.template:
    src: request-insights-helper.sh.j2
    dest: "{{ wps_tools_bin_dir }}/insights"
    owner: root
    group: root
    mode: "0755"

- name: Create PyWPS job-incident archive base directory
  ansible.builtin.file:
    path: "{{ wps_tools_incident_archive_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: wps_tools_incident_archive_enabled | bool

- name: Create per-service PyWPS job-incident archive directories
  ansible.builtin.file:
    path: "{{ wps_tools_incident_archive_dir }}/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop: "{{ wps_services }}"
  when: wps_tools_incident_archive_enabled | bool

- name: Clean up expired PyWPS job incidents
  ansible.builtin.cron:
    name: "clear archived PyWPS job incidents"
    minute: "3"
    hour: "*"
    user: "{{ cron_user }}"
    job: >-
      find {{ wps_tools_incident_archive_dir }} -mindepth 2 -maxdepth 2
      -ignore_readdir_race -type f
      \( -name "*.xml" -o -name "*.dump" \)
      -mmin +{{ wps_tools_incident_keep_minutes }} -delete
    cron_file: ansible_pywps
    disabled: >-
      {{ (cron_disabled | bool)
         or not (wps_tools_incident_archive_enabled | bool) }}
    state: present

- name: Validate Slurm timeout and monitoring settings
  ansible.builtin.assert:
    that:
      - slurm_job_timeout_minutes | int > 0
      - >-
        slurm_job_timeout_minutes | int
        < wps_tools_job_control_stale_after_minutes | float
      - >-
        slurm_job_timeout_minutes | int
        < wps_tools_job_control_database_stale_after_minutes | float
      - wps_tools_slurm_monitor_schedule | type_debug == 'dict'
      - wps_tools_slurm_monitor_user | length > 0
      - wps_tools_slurm_monitor_long_running_minutes | int > 0
      - >-
        wps_tools_slurm_monitor_long_running_minutes | int
        < slurm_job_timeout_minutes | int
      - wps_tools_slurm_monitor_pending_critical | int > 0
    fail_msg: >-
      Slurm requires a positive runtime limit below the PyWPS stale threshold.
      Its optional monitor requires a cron-field mapping, a user, a positive
      pending-job critical threshold, and a positive long-running threshold
      below the hard runtime limit.
  when: slurm_enabled | bool

- name: Install Slurm job-monitor script
  ansible.builtin.copy:
    src: slurm-job-monitor.py
    dest: "{{ wps_tools_slurm_monitor_script }}"
    owner: root
    group: root
    mode: "0755"
  when: slurm_enabled | bool

- name: Install interactive Slurm job-status script
  ansible.builtin.copy:
    src: slurm-job-status.py
    dest: "{{ wps_tools_slurm_status_script }}"
    owner: root
    group: root
    mode: "0755"
  when: slurm_enabled | bool

- name: Remove legacy Slurm live-view shortcuts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ wps_tools_bin_dir }}/slurm-top"
    - "{{ wps_tools_bin_dir }}/top"

- name: Install Slurm live-view shortcut
  ansible.builtin.template:
    src: slurm-top.sh.j2
    dest: "{{ wps_tools_slurm_top_script }}"
    owner: root
    group: root
    mode: "0755"
  when: slurm_enabled | bool

- name: Remove obsolete Slurm job-control script
  ansible.builtin.file:
    path: /usr/local/sbin/slurm-job-control
    state: absent

- name: Remove Slurm job-monitor script when Slurm is disabled
  ansible.builtin.file:
    path: "{{ wps_tools_slurm_monitor_script }}"
    state: absent
  when: not (slurm_enabled | bool)

- name: Remove Slurm job-status tools when Slurm is disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ wps_tools_slurm_status_script }}"
    - "{{ wps_tools_slurm_top_script }}"
  when: not (slurm_enabled | bool)

- name: Remove stale Slurm alert when monitoring is disabled
  ansible.builtin.file:
    path: "{{ wps_tools_slurm_monitor_alert_file }}"
    state: absent
  when: not (wps_tools_slurm_monitor_enabled | bool)

- name: Remove obsolete Slurm job-control cron entry
  ansible.builtin.cron:
    name: control overdue Slurm jobs
    user: root
    cron_file: ansible_slurm
    state: absent

- name: Add MAILTO to Slurm cron file
  community.general.cronvar:
    name: MAILTO
    value: "{{ cron_mailto }}"
    cron_file: ansible_slurm
    state: "{{ 'present' if slurm_enabled | bool else 'absent' }}"

- name: Schedule host-wide Slurm job monitoring
  ansible.builtin.cron:
    name: monitor Slurm jobs
    minute: "{{ wps_tools_slurm_monitor_schedule.minute | default('*/5') }}"
    hour: "{{ wps_tools_slurm_monitor_schedule.hour | default('*') }}"
    day: "{{ wps_tools_slurm_monitor_schedule.day | default('*') }}"
    month: "{{ wps_tools_slurm_monitor_schedule.month | default('*') }}"
    weekday: "{{ wps_tools_slurm_monitor_schedule.weekday | default('*') }}"
    user: root
    job: >-
      {{ wps_tools_slurm_monitor_script }}
      --user {{ wps_tools_slurm_monitor_user | quote }}
      --long-running-minutes {{ wps_tools_slurm_monitor_long_running_minutes }}
      --pending-critical {{ wps_tools_slurm_monitor_pending_critical }}
      --lock-file {{ wps_tools_slurm_monitor_lock_file | quote }}
      --log-file {{ wps_tools_slurm_monitor_log_file | quote }}
      --alert-file {{ wps_tools_slurm_monitor_alert_file | quote }}
    cron_file: ansible_slurm
    disabled: >-
      {{ (cron_disabled | bool) or not (wps_tools_slurm_monitor_enabled | bool) }}
    state: "{{ 'present' if slurm_enabled | bool else 'absent' }}"

- name: Install PyWPS job operator commands
  ansible.builtin.template:
    src: job-control-helper.sh.j2
    dest: "{{ wps_tools_sbin_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - monitor
    - recover

- name: Install WPS statistics command
  ansible.builtin.template:
    src: stats-helper.sh.j2
    dest: "{{ wps_tools_sbin_dir }}/stats"
    owner: root
    group: root
    mode: "0755"

- name: Remove obsolete long statistics command
  ansible.builtin.file:
    path: "{{ wps_tools_sbin_dir }}/statistics"
    state: absent

- name: Remove obsolete recovery commands
  ansible.builtin.file:
    path: "{{ wps_tools_sbin_dir }}/{{ item }}"
    state: absent
  loop:
    - recover-all
    - recover-polling
    - recover-stalled-jobs.py
    - recover-xml
    - recover-xml-db

- name: Remove obsolete lowercase PyWPS monitoring cron entries
  ansible.builtin.cron:
    name: "monitor stalled pywps jobs for {{ item.name }}"
    user: root
    cron_file: ansible_pywps
    state: absent
  loop: "{{ wps_services }}"

- name: Remove obsolete PyWPS recovery cron entries
  ansible.builtin.cron:
    name: "recover stalled pywps jobs for {{ item.name }}"
    user: root
    cron_file: ansible_pywps
    state: absent
  loop: "{{ wps_services }}"

- name: Remove obsolete shared PyWPS restart cron entry
  ansible.builtin.cron:
    name: restart pywps
    user: root
    cron_file: ansible_pywps
    state: absent

- name: Schedule PyWPS job monitoring
  ansible.builtin.cron:
    name: "monitor stalled PyWPS jobs for {{ item.name }}"
    minute: "{{ wps_tools_job_control_schedule.minute | default('*/5') }}"
    hour: "{{ wps_tools_job_control_schedule.hour | default('*') }}"
    day: "{{ wps_tools_job_control_schedule.day | default('*') }}"
    month: "{{ wps_tools_job_control_schedule.month | default('*') }}"
    weekday: "{{ wps_tools_job_control_schedule.weekday | default('*') }}"
    user: root
    job: >-
      {{ conda_envs_dir }}/{{ item.name }}/bin/python
      {{ wps_tools_script_dir }}/pywps-job-control.py
      --config /etc/pywps/{{ item.name }}.cfg monitor
    cron_file: ansible_pywps
    disabled: >-
      {{ cron_disabled }}
    state: present
  loop: "{{ wps_services }}"

- name: Schedule ordered PyWPS job recovery
  ansible.builtin.cron:
    name: "recover stalled PyWPS jobs for {{ item.name }}"
    minute: "{{ wps_tools_job_control_recovery_schedule.minute | default('1-56/5') }}"
    hour: "{{ wps_tools_job_control_recovery_schedule.hour | default('*') }}"
    day: "{{ wps_tools_job_control_recovery_schedule.day | default('*') }}"
    month: "{{ wps_tools_job_control_recovery_schedule.month | default('*') }}"
    weekday: "{{ wps_tools_job_control_recovery_schedule.weekday | default('*') }}"
    user: root
    job: >-
      {{ conda_envs_dir }}/{{ item.name }}/bin/python
      {{ wps_tools_script_dir }}/pywps-job-control.py
      --config /etc/pywps/{{ item.name }}.cfg recover
    cron_file: ansible_pywps
    disabled: >-
      {{ (cron_disabled | bool)
         or not (wps_tools_job_control_recovery_enabled | bool) }}
    state: present
  loop: "{{ wps_services }}"

- name: Remove separate missing-status recovery schedule
  ansible.builtin.cron:
    name: "recover missing pywps status documents for {{ item.name }}"
    user: root
    cron_file: ansible_pywps
    state: absent
  loop: "{{ wps_services }}"

- name: Remove obsolete daily PyWPS statistics cron entries
  ansible.builtin.cron:
    name: "record daily PyWPS job statistics for {{ item.name }}"
    user: root
    cron_file: ansible_pywps
    state: absent
  loop: "{{ wps_services }}"

- name: Schedule hourly PyWPS job statistics
  ansible.builtin.cron:
    name: "record hourly PyWPS job statistics for {{ item.name }}"
    minute: "{{ wps_tools_statistics_schedule.minute | default('4') }}"
    hour: "{{ wps_tools_statistics_schedule.hour | default('*') }}"
    day: "{{ wps_tools_statistics_schedule.day | default('*') }}"
    month: "{{ wps_tools_statistics_schedule.month | default('*') }}"
    weekday: "{{ wps_tools_statistics_schedule.weekday | default('*') }}"
    user: root
    job: >-
      {{ wps_tools_sbin_dir }}/stats {{ item.name }} --quiet
    cron_file: ansible_pywps
    disabled: >-
      {{ (cron_disabled | bool)
         or not (wps_tools_statistics_enabled | bool) }}
    state: present
  loop: "{{ wps_services }}"

- name: Remove legacy hourly PyWPS XML request inspection schedule
  ansible.builtin.cron:
    name: "record hourly PyWPS XML requests for {{ item.name }}"
    user: root
    cron_file: ansible_pywps
    state: absent
  loop: "{{ wps_services }}"

- name: Check for legacy XML inspection state files
  ansible.builtin.stat:
    path: "{{ service_user_home }}/.{{ item.name }}-xml-inspect-state.json"
  loop: "{{ wps_services }}"
  register: wps_tools_legacy_inspection_states

- name: Preserve legacy XML inspection state files
  ansible.builtin.copy:
    src: "{{ service_user_home }}/.{{ item.item.name }}-xml-inspect-state.json"
    dest: "{{ wps_tools_state_dir }}/{{ item.item.name }}-xml-inspect.json"
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0644"
  loop: "{{ wps_tools_legacy_inspection_states.results }}"
  when: item.stat.exists

- name: Schedule PyWPS XML request inspection
  ansible.builtin.cron:
    name: "record PyWPS XML requests for {{ item.name }}"
    minute: "{{ wps_tools_inspect_schedule.minute | default('2-57/5') }}"
    hour: "{{ wps_tools_inspect_schedule.hour | default('*') }}"
    day: "{{ wps_tools_inspect_schedule.day | default('*') }}"
    month: "{{ wps_tools_inspect_schedule.month | default('*') }}"
    weekday: "{{ wps_tools_inspect_schedule.weekday | default('*') }}"
    user: root
    job: >-
      /usr/bin/python3 {{ wps_tools_script_dir }}/pywps-xml-inspect.py
      --config /etc/pywps/{{ item.name }}.cfg
      --service {{ item.name }}
      --state-file {{ wps_tools_state_dir }}/{{ item.name }}-xml-inspect.json
      --log-file {{ wps_log_dir }}/{{ item.name }}-events.jsonl
      --lock-file {{ wps_run_dir }}/{{ item.name }}-xml-inspect.lock
    cron_file: ansible_pywps
    disabled: "{{ (cron_disabled | bool) or not (wps_tools_inspect_enabled | bool) }}"
    state: present
  loop: "{{ wps_services }}"

- name: Validate PyWPS restart schedule
  ansible.builtin.assert:
    that:
      - wps_tools_restart_schedule in ['hourly', 'daily']
    fail_msg: wps_tools_restart_schedule must be hourly or daily.

- name: Copy restart script
  ansible.builtin.template:
    src: restart-pywps.sh.j2
    dest: "{{ wps_tools_sbin_dir }}/restart-pywps"
    owner: root
    group: root
    mode: "0744"

- name: Schedule PyWPS service restarts
  ansible.builtin.cron:
    name: "restart pywps {{ item.name }}"
    special_time: "{{ wps_tools_restart_schedule }}"
    user: root
    job: >-
      {{ wps_tools_sbin_dir }}/restart-pywps {{ item.name }}
      > /var/log/pywps/restart-{{ item.name }}.log 2>&1
    cron_file: ansible_pywps
    disabled: >-
      {{ (cron_disabled | bool) or not (wps_tools_restart_enabled | bool) }}
    state: present
  loop: "{{ wps_services }}"

- name: Copy smoke test script
  ansible.builtin.template:
    src: smoke.sh.j2
    dest: "{{ wps_tools_bin_dir }}/smoke"
    owner: root
    group: root
    mode: "0755"

- name: Remove obsolete administrative smoke command
  ansible.builtin.file:
    path: "{{ wps_tools_sbin_dir }}/smoke"
    state: absent

- name: Remove tools from the legacy PyWPS state directory
  ansible.builtin.file:
    path: "{{ service_user_home }}/{{ item }}"
    state: absent
  loop:
    - pywps-job-control.py
    - pywps-db-monitor.py
    - pywps-db-report.py
    - pywps-job-status.py
    - pywps-xml-inspect.py
    - pywps-request-insights.py
    - slurm-job-status.py
    - db-monitor
    - inspect-jobs
    - request-insights
    - insights
    - monitor
    - recover
    - statistics
    - recover-all
    - recover-polling
    - recover-stalled-jobs.py
    - recover-xml
    - recover-xml-db
    - slurm-top
    - top
    - qtop
    - ptop
    - restart-pywps.sh
    - smoke.sh

- name: Remove legacy XML inspection state files
  ansible.builtin.file:
    path: "{{ service_user_home }}/.{{ item.name }}-xml-inspect-state.json"
    state: absent
  loop: "{{ wps_services }}"

- name: Remove legacy Slurm job-monitor script
  ansible.builtin.file:
    path: /usr/local/sbin/slurm-job-monitor
    state: absent
  when: wps_tools_slurm_monitor_script != '/usr/local/sbin/slurm-job-monitor'
