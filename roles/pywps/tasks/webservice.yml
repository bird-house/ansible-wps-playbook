---
- name: Include cleanup tasks
  include_tasks: clean.yml

- name: Include cron tasks
  include_tasks: cronjob.yml

- name: Include web service configuration tasks
  include_tasks: webservice_config.yml

- name: Include log rotation tasks
  include_tasks: logrotate.yml

- name: Include SELinux tasks
  include_tasks: selinux.yml
  when: selinux_enabled

- name: Include Slurm tasks
  include_tasks: slurm.yml
  when: slurm_enabled
  tags:
    - slurm

- name: Include SQLite tasks
  include_tasks: sqlite.yml
  when: db_install_sqlite

- name: Include file server tasks
  include_tasks: fileserver.yml
  when: fs_enabled

- name: Assure PyWPS running at end of playbook
  command: /bin/true
  notify:
    - restart supervisord
  tags:
    - pywps
    - conf

- name: Assure nginx running at end of playbook
  command: /bin/true
  notify:
    - restart nginx
  tags:
    - nginx
    - conf
