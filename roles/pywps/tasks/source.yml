---
- name: Clone WPS.
  git:
    repo: "{{ item.repo | default('https://github.com/bird-house/' + item.name + '.git') }}"
    version: "{{ item.version | default('master') }}"
    dest: "{{ src_dir }}/{{ item.name }}"
    update: true
    force: true
  with_items: "{{ wps_services }}"
  tags:
    - pywps
    - git
