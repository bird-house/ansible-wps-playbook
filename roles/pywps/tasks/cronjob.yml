---
- name: Clean up cron files managed by ansible
  file:
    path: "/etc/cron.d/{{ item }}"
    state: absent
  with_items:
    - ansible_pywps

- name: Add MAILTO to cron file
  community.general.cronvar:
    name: MAILTO
    value: "{{ cron_mailto }}"
    cron_file: ansible_pywps

- name: Clear wps outputs
  cron:
    name: "clear wps outputs"
    special_time: hourly
    user: "{{ cron_user }}"
    job: >-
      find {{ wps_basedir }}/outputs/* -maxdepth 1 -type d
      -mmin +{{ wps_outputs_keep_minutes }} -regextype sed
      -regex ".*/[a-f0-9\-]\{36\}$" -exec rm -rf {} \;
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Clear wps status
  cron:
    name: "clear wps status"
    special_time: hourly
    user: "{{ cron_user }}"
    job: 'find {{ wps_basedir }}/outputs/* -maxdepth 1 -type f -mmin +{{ wps_outputs_keep_minutes }} -regextype sed -regex ".*/[a-f0-9\-]\{36\}\.xml$" -delete'
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Clear wps tempfiles
  cron:
    name: "clear wps tempfiles"
    special_time: hourly
    user: "{{ cron_user }}"
    job: 'find {{ wps_basedir }}/tmp/* -maxdepth 1 -type d -mmin +{{ wps_temp_keep_minutes }} -name "pywps_process_*" -exec rm -rf {} \;'
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Ensure cron script dir exists
  file:
    path: "{{ cron_script_dir }}"
    state: directory
    owner: root
    mode: "0755"

- name: Validate stalled-job recovery settings
  ansible.builtin.assert:
    that:
      - pywps_stalled_jobs_schedule | type_debug == 'dict'
      - pywps_stalled_jobs_age_hours | float > 0
      - pywps_stalled_jobs_layers | length > 0
      - pywps_stalled_jobs_layers | difference(['xml', 'database', 'all']) | length == 0
      - >-
        not (cron_enabled | bool)
        or not (pywps_stalled_jobs_enabled | bool)
        or ('xml' not in pywps_stalled_jobs_layers
            and 'all' not in pywps_stalled_jobs_layers)
        or (pywps_stalled_jobs_age_hours | float) < (wps_outputs_keep_hours | float)
    fail_msg: >-
      The stalled-job schedule must be a cron-field mapping, age must be
      positive and shorter than output retention for scheduled XML checks,
      and layers must contain xml, database, or all.

- name: Copy stalled-job recovery script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/recover-stalled-jobs.py"
    dest: "{{ cron_script_dir }}/recover-stalled-jobs.py"
    owner: root
    group: root
    mode: "0755"

- name: Copy stalled-job command helpers
  ansible.builtin.template:
    src: ./templates/stalled-jobs-helper.sh.j2
    dest: "{{ cron_script_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - monitor
    - recover-xml
    - recover-all

- name: Schedule stalled-job checks
  ansible.builtin.cron:
    name: "monitor stalled pywps jobs for {{ item.name }}"
    minute: "{{ pywps_stalled_jobs_schedule.minute | default('15') }}"
    hour: "{{ pywps_stalled_jobs_schedule.hour | default('*') }}"
    day: "{{ pywps_stalled_jobs_schedule.day | default('*') }}"
    month: "{{ pywps_stalled_jobs_schedule.month | default('*') }}"
    weekday: "{{ pywps_stalled_jobs_schedule.weekday | default('*') }}"
    user: root
    job: >-
      {{ conda_envs_dir }}/{{ item.name }}/bin/python
      {{ cron_script_dir }}/recover-stalled-jobs.py
      --config /etc/pywps/{{ item.name }}.cfg monitor
    cron_file: ansible_pywps
    disabled: >-
      {{ (cron_disabled | bool) or not (pywps_stalled_jobs_enabled | bool) }}
    state: present
  loop: "{{ wps_services }}"

- name: Validate PyWPS restart schedule
  ansible.builtin.assert:
    that:
      - pywps_restart_schedule in ['hourly', 'daily']
    fail_msg: pywps_restart_schedule must be hourly or daily.

- name: Copy restart script
  template:
    src: ./templates/restart-pywps.sh.j2
    dest: "{{ cron_script_dir }}/restart-pywps.sh"
    owner: root
    mode: "0744"

- name: Schedule PyWPS service restarts
  cron:
    name: "restart pywps {{ item.name }}"
    special_time: "{{ pywps_restart_schedule }}"
    user: root
    job: "{{ cron_script_dir }}/restart-pywps.sh {{ item.name }} > /var/log/pywps/restart-{{ item.name }}.log 2>&1"
    cron_file: ansible_pywps
    disabled: >-
      {{ (cron_disabled | bool) or not (pywps_restart_enabled | bool) }}
    state: present
  with_items:
    - "{{ wps_services }}"

- name: Copy smoke test script
  template:
    src: ./templates/smoke.sh.j2
    dest: "{{ cron_script_dir }}/smoke.sh"
    owner: root
    mode: "0744"
