---
- name: Add MAILTO to cron file
  community.general.cronvar:
    name: MAILTO
    value: "{{ cron_mailto }}"
    cron_file: ansible_pywps

- name: Clear PyWPS output directories
  ansible.builtin.cron:
    name: "clear wps outputs"
    special_time: hourly
    user: "{{ cron_user }}"
    job: >-
      find {{ wps_basedir }}/outputs -mindepth 2 -maxdepth 2
      -ignore_readdir_race -type d
      -mmin +{{ wps_outputs_keep_minutes }} -regextype sed
      -regex ".*/[a-f0-9\-]\{36\}$"
      -prune -exec rm -rf -- {} \;
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Clear PyWPS status documents
  ansible.builtin.cron:
    name: "clear wps status"
    special_time: hourly
    user: "{{ cron_user }}"
    job: >-
      find {{ wps_basedir }}/outputs -mindepth 2 -maxdepth 2
      -ignore_readdir_race -type f
      -mmin +{{ wps_outputs_keep_minutes }} -regextype sed
      -regex ".*/[a-f0-9\-]\{36\}\.xml$" -delete
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Clear PyWPS temporary process directories
  ansible.builtin.cron:
    name: "clear wps tempfiles"
    special_time: hourly
    user: "{{ cron_user }}"
    job: >-
      find {{ wps_basedir }}/tmp -mindepth 2 -maxdepth 2
      -ignore_readdir_race -type d
      -mmin +{{ wps_temp_keep_minutes }} -name "pywps_process_*"
      -prune -exec rm -rf -- {} \;
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Ensure cron script dir exists
  ansible.builtin.file:
    path: "{{ cron_script_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Validate job-control settings
  ansible.builtin.assert:
    that:
      - pywps_job_control_schedule | type_debug == 'dict'
      - pywps_job_statistics_schedule | type_debug == 'dict'
      - pywps_job_control_stale_after_hours | float > 0
      - pywps_job_control_recovery_limit | int > 0
      - pywps_job_control_layers | length > 0
      - pywps_job_control_layers | difference(['xml', 'database', 'polling']) | length == 0
      - pywps_missing_status_recovery_schedule | type_debug == 'dict'
      - pywps_missing_status_poll_window_minutes | float > 0
      - pywps_missing_status_min_poll_count | int > 0
      - pywps_missing_status_min_poll_duration_minutes | float >= 0
      - >-
        (pywps_missing_status_min_poll_duration_minutes | float)
        < (pywps_missing_status_poll_window_minutes | float)
      - pywps_missing_status_recovery_limit | int > 0
      - >-
        not (cron_enabled | bool)
        or not (pywps_job_control_monitor_enabled | bool)
        or 'xml' not in pywps_job_control_layers
        or (pywps_job_control_stale_after_hours | float) < (wps_outputs_keep_hours | float)
    fail_msg: >-
      The job-control schedule must be a cron-field mapping, age must be
      positive and shorter than output retention for scheduled XML checks,
      recovery limit must be positive, and layers must contain xml, database,
      or polling. Missing-status recovery also requires a valid schedule,
      positive polling window, poll count and recovery limit, and a minimum
      poll duration shorter than its polling window.

- name: Install PyWPS job-control script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/pywps-job-control.py"
    dest: "{{ cron_script_dir }}/pywps-job-control.py"
    owner: root
    group: root
    mode: "0755"

- name: Validate Slurm timeout and monitoring settings
  ansible.builtin.assert:
    that:
      - slurm_job_timeout_minutes | int > 0
      - slurm_job_monitor_schedule | type_debug == 'dict'
      - slurm_job_monitor_user | length > 0
      - slurm_job_monitor_long_running_minutes | int > 0
      - >-
        slurm_job_monitor_long_running_minutes | int
        < slurm_job_timeout_minutes | int
      - slurm_job_monitor_pending_warning | int > 0
    fail_msg: >-
      Slurm requires a positive runtime limit. Its optional monitor requires a
      cron-field mapping, a user, a positive pending-job warning threshold,
      and a positive long-running threshold below the hard runtime limit.
  when: slurm_enabled | bool

- name: Install Slurm job-monitor script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/slurm-job-monitor.py"
    dest: "{{ slurm_job_monitor_script }}"
    owner: root
    group: root
    mode: "0755"
  when: slurm_enabled | bool

- name: Remove obsolete Slurm job-control script
  ansible.builtin.file:
    path: /usr/local/sbin/slurm-job-control
    state: absent

- name: Remove Slurm job-monitor script when Slurm is disabled
  ansible.builtin.file:
    path: "{{ slurm_job_monitor_script }}"
    state: absent
  when: not (slurm_enabled | bool)

- name: Remove obsolete Slurm job-control cron entry
  ansible.builtin.cron:
    name: control overdue Slurm jobs
    user: root
    cron_file: ansible_slurm
    state: absent

- name: Schedule host-wide Slurm job monitoring
  ansible.builtin.cron:
    name: monitor Slurm jobs
    minute: "{{ slurm_job_monitor_schedule.minute | default('15') }}"
    hour: "{{ slurm_job_monitor_schedule.hour | default('*') }}"
    day: "{{ slurm_job_monitor_schedule.day | default('*') }}"
    month: "{{ slurm_job_monitor_schedule.month | default('*') }}"
    weekday: "{{ slurm_job_monitor_schedule.weekday | default('*') }}"
    user: root
    job: >-
      {{ slurm_job_monitor_script }}
      --user {{ slurm_job_monitor_user | quote }}
      --long-running-minutes {{ slurm_job_monitor_long_running_minutes }}
      --pending-warning {{ slurm_job_monitor_pending_warning }}
      --lock-file {{ slurm_job_monitor_lock_file | quote }}
      --log-file {{ slurm_job_monitor_log_file | quote }}
    cron_file: ansible_slurm
    disabled: >-
      {{ (cron_disabled | bool) or not (slurm_job_monitor_enabled | bool) }}
    state: "{{ 'present' if slurm_enabled | bool else 'absent' }}"

- name: Remove obsolete stalled-job script alias
  ansible.builtin.file:
    path: "{{ cron_script_dir }}/recover-stalled-jobs.py"
    state: absent

- name: Install PyWPS job operator commands
  ansible.builtin.template:
    src: ./templates/job-control-helper.sh.j2
    dest: "{{ cron_script_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - monitor
    - recover-xml
    - recover-polling
    - recover-xml-db
    - statistics

- name: Remove obsolete recovery commands
  ansible.builtin.file:
    path: "{{ cron_script_dir }}/{{ item }}"
    state: absent
  loop:
    - recover
    - recover-all

- name: Remove obsolete lowercase PyWPS monitoring cron entries
  ansible.builtin.cron:
    name: "monitor stalled pywps jobs for {{ item.name }}"
    user: root
    cron_file: ansible_pywps
    state: absent
  loop: "{{ wps_services }}"

- name: Remove obsolete PyWPS recovery cron entries
  ansible.builtin.cron:
    name: "recover stalled pywps jobs for {{ item.name }}"
    user: root
    cron_file: ansible_pywps
    state: absent
  loop: "{{ wps_services }}"

- name: Remove obsolete shared PyWPS restart cron entry
  ansible.builtin.cron:
    name: restart pywps
    user: root
    cron_file: ansible_pywps
    state: absent

- name: Schedule PyWPS job monitoring
  ansible.builtin.cron:
    name: "monitor stalled PyWPS jobs for {{ item.name }}"
    minute: "{{ pywps_job_control_schedule.minute | default('15') }}"
    hour: "{{ pywps_job_control_schedule.hour | default('*') }}"
    day: "{{ pywps_job_control_schedule.day | default('*') }}"
    month: "{{ pywps_job_control_schedule.month | default('*') }}"
    weekday: "{{ pywps_job_control_schedule.weekday | default('*') }}"
    user: root
    job: >-
      {{ conda_envs_dir }}/{{ item.name }}/bin/python
      {{ cron_script_dir }}/pywps-job-control.py
      --config /etc/pywps/{{ item.name }}.cfg monitor
      --layer xml --layer database --layer polling
    cron_file: ansible_pywps
    disabled: >-
      {{ cron_disabled }}
    state: present
  loop: "{{ wps_services }}"

- name: Schedule recovery of repeatedly polled missing PyWPS status documents
  ansible.builtin.cron:
    name: "recover missing pywps status documents for {{ item.name }}"
    minute: "{{ pywps_missing_status_recovery_schedule.minute | default('*/10') }}"
    hour: "{{ pywps_missing_status_recovery_schedule.hour | default('*') }}"
    day: "{{ pywps_missing_status_recovery_schedule.day | default('*') }}"
    month: "{{ pywps_missing_status_recovery_schedule.month | default('*') }}"
    weekday: "{{ pywps_missing_status_recovery_schedule.weekday | default('*') }}"
    user: root
    job: >-
      {{ conda_envs_dir }}/{{ item.name }}/bin/python
      {{ cron_script_dir }}/pywps-job-control.py
      --config /etc/pywps/{{ item.name }}.cfg recover
      --layer polling
      --limit {{ pywps_missing_status_recovery_limit }}
    cron_file: ansible_pywps
    disabled: >-
      {{ cron_disabled }}
    state: present
  loop: "{{ wps_services }}"

- name: Schedule daily PyWPS job statistics
  ansible.builtin.cron:
    name: "record daily PyWPS job statistics for {{ item.name }}"
    minute: "{{ pywps_job_statistics_schedule.minute | default('5') }}"
    hour: "{{ pywps_job_statistics_schedule.hour | default('0') }}"
    day: "{{ pywps_job_statistics_schedule.day | default('*') }}"
    month: "{{ pywps_job_statistics_schedule.month | default('*') }}"
    weekday: "{{ pywps_job_statistics_schedule.weekday | default('*') }}"
    user: root
    job: >-
      {{ conda_envs_dir }}/{{ item.name }}/bin/python
      {{ cron_script_dir }}/pywps-job-control.py
      --config /etc/pywps/{{ item.name }}.cfg statistics
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present
  loop: "{{ wps_services }}"

- name: Validate PyWPS restart schedule
  ansible.builtin.assert:
    that:
      - pywps_restart_schedule in ['hourly', 'daily']
    fail_msg: pywps_restart_schedule must be hourly or daily.

- name: Copy restart script
  ansible.builtin.template:
    src: ./templates/restart-pywps.sh.j2
    dest: "{{ cron_script_dir }}/restart-pywps.sh"
    owner: root
    group: root
    mode: "0744"

- name: Schedule PyWPS service restarts
  ansible.builtin.cron:
    name: "restart pywps {{ item.name }}"
    special_time: "{{ pywps_restart_schedule }}"
    user: root
    job: >-
      {{ cron_script_dir }}/restart-pywps.sh {{ item.name }}
      > /var/log/pywps/restart-{{ item.name }}.log 2>&1
    cron_file: ansible_pywps
    disabled: >-
      {{ (cron_disabled | bool) or not (pywps_restart_enabled | bool) }}
    state: present
  loop: "{{ wps_services }}"

- name: Copy smoke test script
  ansible.builtin.template:
    src: ./templates/smoke.sh.j2
    dest: "{{ cron_script_dir }}/smoke.sh"
    owner: root
    group: root
    mode: "0744"
