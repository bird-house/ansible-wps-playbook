---
- name: Clean up cron files managed by ansible
  file:
    path: "/etc/cron.d/{{ item }}"
    state: absent
  with_items:
    - ansible_pywps

- name: Add MAILTO to cron file
  community.general.cronvar:
    name: MAILTO
    value: "{{ cron_mailto }}"
    cron_file: ansible_pywps

- name: Clear wps outputs
  cron:
    name: "clear wps outputs"
    special_time: hourly
    user: "{{ cron_user }}"
    job: >-
      find {{ wps_basedir }}/outputs/* -maxdepth 1 -type d
      -mmin +{{ wps_outputs_keep_minutes }} -regextype sed
      -regex ".*/[a-f0-9\-]\{36\}$" -exec rm -rf {} \;
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Clear wps status
  cron:
    name: "clear wps status"
    special_time: hourly
    user: "{{ cron_user }}"
    job: 'find {{ wps_basedir }}/outputs/* -maxdepth 1 -type f -mmin +{{ wps_outputs_keep_minutes }} -regextype sed -regex ".*/[a-f0-9\-]\{36\}\.xml$" -delete'
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Clear wps tempfiles
  cron:
    name: "clear wps tempfiles"
    special_time: hourly
    user: "{{ cron_user }}"
    job: 'find {{ wps_basedir }}/tmp/* -maxdepth 1 -type d -mmin +{{ wps_temp_keep_minutes }} -name "pywps_process_*" -exec rm -rf {} \;'
    cron_file: ansible_pywps
    disabled: "{{ cron_disabled }}"
    state: present

- name: Ensure cron script dir exists
  file:
    path: "{{ cron_script_dir }}"
    state: directory
    owner: root
    mode: "0755"

- name: Validate stalled-job recovery settings
  ansible.builtin.assert:
    that:
      - pywps_stalled_jobs_schedule in ['hourly', 'daily']
      - pywps_stalled_jobs_age_hours | float > 0
      - not (pywps_stalled_jobs_terminate | bool) or (pywps_stalled_jobs_recover | bool)
      - not (pywps_stalled_jobs_cleanup | bool) or (pywps_stalled_jobs_recover | bool)
    fail_msg: >-
      The stalled-job schedule must be hourly or daily, age must be positive,
      and termination or cleanup requires recovery mode.

- name: Copy stalled-job recovery script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/recover-stalled-jobs.py"
    dest: "{{ cron_script_dir }}/recover-stalled-jobs.py"
    owner: root
    group: root
    mode: "0755"

- name: Schedule stalled-job checks
  ansible.builtin.cron:
    name: "recover stalled pywps jobs for {{ item.name }}"
    special_time: "{{ pywps_stalled_jobs_schedule }}"
    user: root
    job: >-
      {{ cron_script_dir }}/recover-stalled-jobs.py
      --output-dir {{ wps_basedir }}/outputs/{{ item.name }}
      --work-dir {{ wps_basedir }}/tmp/{{ item.name }}
      --service-log {{ wps_log_dir }}/{{ item.name }}.log
      --age-hours {{ pywps_stalled_jobs_age_hours }}
      --user {{ wps_user }}
      --lock-file /run/lock/pywps-stalled-jobs-{{ item.name }}.lock
      --log-file {{ pywps_stalled_jobs_log_dir }}/stalled-jobs-{{ item.name }}.log
      {{ '--slurm' if slurm_enabled | bool else '' }}
      {{ '--recover' if pywps_stalled_jobs_recover | bool else '' }}
      {{ '--terminate' if pywps_stalled_jobs_terminate | bool else '' }}
      {{ '--cleanup' if pywps_stalled_jobs_cleanup | bool else '' }}
    cron_file: ansible_pywps
    disabled: >-
      {{ (cron_disabled | bool) or not (pywps_stalled_jobs_enabled | bool) }}
    state: present
  loop: "{{ wps_services }}"

- name: Validate PyWPS restart schedule
  ansible.builtin.assert:
    that:
      - pywps_restart_schedule in ['hourly', 'daily']
    fail_msg: pywps_restart_schedule must be hourly or daily.

- name: Copy restart script
  template:
    src: ./templates/restart-pywps.sh.j2
    dest: "{{ cron_script_dir }}/restart-pywps.sh"
    owner: root
    mode: "0744"

- name: Schedule PyWPS service restarts
  cron:
    name: "restart pywps {{ item.name }}"
    special_time: "{{ pywps_restart_schedule }}"
    user: root
    job: "{{ cron_script_dir }}/restart-pywps.sh {{ item.name }} > /var/log/pywps/restart-{{ item.name }}.log 2>&1"
    cron_file: ansible_pywps
    disabled: >-
      {{ (cron_disabled | bool) or not (pywps_restart_enabled | bool) }}
    state: present
  with_items:
    - "{{ wps_services }}"

- name: Copy smoke test script
  template:
    src: ./templates/smoke.sh.j2
    dest: "{{ cron_script_dir }}/smoke.sh"
    owner: root
    mode: "0744"
