---
- name: Remove Conda environment.
  command: "{{ conda_location }}/bin/conda env remove -q -y -p {{ conda_envs_dir }}/{{ item.name }}"
  with_items: "{{ wps_services }}"
  ignore_errors: true
  tags:
    - pywps
    - conda

- name: Create Conda environment from environment file.
  command: "{{ conda_bin }} env create --file {{ conda_env_file }} -p {{ conda_envs_dir }}/{{ item.name }}"
  args:
    chdir: "{{ src_dir }}/{{ item.name }}"
  with_items: "{{ wps_services }}"
  when: not conda_env_use_spec
  register: pywps_conda_env
  tags:
    - pywps
    - conda

- name: Check configured Conda specification.
  ansible.builtin.stat:
    path: "{{ src_dir }}/{{ item.name }}/{{ conda_env_spec_file }}"
  with_items: "{{ wps_services }}"
  when: conda_env_use_spec
  register: pywps_conda_spec_files
  tags:
    - pywps
    - conda

- name: Report missing Conda specification.
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      Conda specification {{ conda_env_spec_file }} was not found in the
      {{ item.item.name }} repository. If the repository still contains the
      legacy spec-list.txt file, rename it to linux-64.spec or set
      conda_env_spec_file: spec-list.txt in the inventory for compatibility.
  with_items: "{{ pywps_conda_spec_files.results }}"
  when:
    - conda_env_use_spec
    - not (item.skipped | default(false))
  tags:
    - pywps
    - conda

- name: Create Conda environment from configured specification.
  command: "{{ conda_location }}/bin/conda create --file {{ conda_env_spec_file }} -p {{ conda_envs_dir }}/{{ item.name }}"
  args:
    chdir: "{{ src_dir }}/{{ item.name }}"
  with_items: "{{ wps_services }}"
  when: conda_env_use_spec
  register: pywps_conda_env_spec
  tags:
    - pywps
    - conda

- name: Install additional Conda packages.
  ansible.builtin.command:
    argv: >-
      {{ [conda_bin, 'install', '--yes', '--freeze-installed',
          '--channel', wps_conda_channel,
          '--prefix', conda_envs_dir + '/' + item.name]
         + wps_conda_packages }}
  with_items: "{{ wps_services }}"
  when:
    - pywps_conda_env.changed or pywps_conda_env_spec.changed
    - wps_conda_packages | length > 0
  tags:
    - pywps
    - conda

- name: Install additional pip packages.
  ansible.builtin.command:
    argv: >-
      {{ [conda_envs_dir + '/' + item.name + '/bin/python',
          '-m', 'pip', 'install'] + wps_pip_packages }}
  with_items: "{{ wps_services }}"
  when:
    - pywps_conda_env.changed or pywps_conda_env_spec.changed
    - wps_pip_packages | length > 0
  tags:
    - pywps
    - conda

- name: Check for the unsafe binary PostgreSQL wheel.
  ansible.builtin.command:
    argv:
      - "{{ conda_envs_dir }}/{{ item.name }}/bin/python"
      - -m
      - pip
      - show
      - psycopg2-binary
  with_items: "{{ wps_services }}"
  when: "'psycopg2=2.9.12' in wps_conda_packages"
  register: pywps_psycopg2_binary
  changed_when: false
  failed_when: false
  tags:
    - pywps
    - conda

- name: Reject the unsafe binary PostgreSQL wheel.
  ansible.builtin.assert:
    that: item.rc != 0
    fail_msg: >-
      The {{ item.item.name }} environment contains psycopg2-binary; use the
      Conda-linked psycopg2 package instead.
  loop: "{{ pywps_psycopg2_binary.results }}"
  when:
    - "'psycopg2=2.9.12' in wps_conda_packages"
    - not item.skipped | default(false)
  tags:
    - pywps
    - conda
