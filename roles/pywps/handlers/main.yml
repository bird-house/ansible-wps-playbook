---
- name: Reload systemd and restart supervisord
  ansible.builtin.systemd:
    name: supervisord
    state: restarted
    daemon_reload: true
  when: ansible_service_mgr == "systemd"
  listen: restart supervisord

- name: Restart supervisord without systemd
  ansible.builtin.service:
    name: supervisord
    state: restarted
  when: ansible_service_mgr != "systemd"
  listen: restart supervisord

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: restart nginx

- name: Restart nginx
  ansible.builtin.service:
    name: nginx
    state: restarted
  listen: restart nginx
