---
# Variables listed here are applicable to all host groups
prefix: /usr/local
src_dir: "{{ prefix }}/src"
server_name: localhost
service_add_user: true
service_user: wps
# service_uid: 500
service_group: "{{ service_user }}"
service_groups: "{{ service_group }}"
# service_gid: 100
service_user_home: /var/lib/pywps
cron_script_dir: "{{ service_user_home }}"

# collectd host monitoring (Red Hat family version 9 only)
collectd_enabled: true
collectd_hostname: localhost
collectd_interval: 60
collectd_csv_dir: /var/lib/collectd/csv
collectd_load_enabled: true
collectd_disk_enabled: false
collectd_disk_mount: /mnt/ext_pywps_outputs
collectd_memory_enabled: false
collectd_interface_enabled: false
collectd_interface: "{{ ansible_default_ipv4.interface | default('eth0') }}"
collectd_cleanup_enabled: true
collectd_cleanup_script: /usr/local/sbin/collectd-cleanup
collectd_cleanup_schedule: "*-*-* 00:30:00"
collectd_compress_after_days: 7
collectd_keep_days: 30
collectd_summary_enabled: true
collectd_summary_script: /usr/local/sbin/collectd-daily-summary
collectd_summary_schedule: "*-*-* 00:10:00"
collectd_summary_output_dir: /var/log
collectd_summary_output: "{{ collectd_summary_output_dir }}/collectd-daily-summary.log"
collectd_hourly_summary_enabled: true
collectd_hourly_summary_schedule: "*-*-* *:05:00"
collectd_hourly_summary_output: >-
  {{ collectd_summary_output_dir }}/collectd-hourly-summary.log

# postgres
db_install_postgresql: true
db_install_sqlite: false
db_host: localhost
db_port: 5432
db_user: pywps
db_password: pywps

# nginx fileserver
fs_enabled: false
fs_host: localhost
fs_port: 6000

# Shared long-running threshold. The WPS and Slurm settings below inherit this
# value but remain independently overridable in deployment inventories.
job_long_running_minutes: 1

# slurm/drmaa
# https://github.com/galaxyproject/ansible-slurm
slurm_enabled: false
slurm_cpus: 4
slurm_drmaa_version: 1.1.4
slurm_roles: ['controller', 'exec']
# Keep host services outside Slurm's allocatable memory. Jobs receive an equal
# share by default, while deployments with memory-heavy workloads can raise
# the per-job allocation and let Slurm run fewer jobs concurrently.
slurm_system_memory_reserve_percent: 20
slurm_real_memory_mb: >-
  {{
    ((ansible_memtotal_mb | int)
     * (100 - (slurm_system_memory_reserve_percent | int)) / 100) | int
  }}
slurm_default_job_memory_mb: >-
  {{
    [
      ((slurm_real_memory_mb | int) // (slurm_cpus | int)),
      1
    ] | max
  }}
slurm_max_job_memory_mb: "{{ slurm_real_memory_mb }}"
slurm_config:
  JobAcctGatherType: "jobacct_gather/cgroup"
  ProctrackType: "proctrack/cgroup"
  SchedulerType: "sched/backfill"
  SelectType: "select/cons_res"
  SelectTypeParameters: "CR_Core_Memory"
  TaskPlugin: "task/affinity,task/cgroup"
slurm_cgroup_config:
  AllowedRAMSpace: 100
  AllowedSwapSpace: 0
  ConstrainCores: true
  ConstrainRAMSpace: true
  ConstrainSwapSpace: true
slurm_nodes:
  - name: localhost
    CPUs: "{{ slurm_cpus }}"
    RealMemory: "{{ slurm_real_memory_mb }}"
slurm_partitions:
  - name: fast
    Default: YES
    DefaultTime: "{{ slurm_job_timeout_minutes }}"
    DefMemPerNode: "{{ slurm_default_job_memory_mb }}"
    MaxMemPerNode: "{{ slurm_max_job_memory_mb }}"
    MaxTime: "{{ slurm_job_timeout_minutes }}"
    Nodes: localhost
slurm_munge_key: /etc/munge/munge.key
# The local prerequisite role creates the key and manages the Munge service.
slurm_configure_munge: false
# Slurm stops the process before PyWPS treats its request as stale.
slurm_job_timeout_minutes: 90
# Report host-wide Slurm queue pressure and long-running jobs by default.
slurm_job_monitor_enabled: true
slurm_job_monitor_schedule:
  minute: "*/5"
  hour: "*"
  day: "*"
  month: "*"
  weekday: "*"
slurm_job_monitor_user: "{{ wps_user }}"
# Warn well before Slurm reaches the hard timeout.
slurm_job_monitor_long_running_minutes: "{{ job_long_running_minutes }}"
slurm_job_monitor_pending_critical: 20
slurm_job_monitor_script: /usr/local/sbin/slurm-job-monitor
slurm_job_monitor_lock_file: /run/lock/slurm-job-monitor.lock
slurm_job_monitor_log_file: "{{ wps_log_dir }}/slurm-job-monitor.log"
slurm_job_monitor_alert_file: "{{ wps_run_dir }}/slurm-red-alert.json"

# miniconda: we need to use Miniforge! See extra_vars.yml
miniconda_parent_dir: "{{ prefix }}"
miniconda_make_sys_default: False
miniconda_pkg_update: false

# conda
conda_location: "{{ prefix }}/anaconda"
conda_bin: "{{ conda_location }}/bin/conda"
conda_envs_dir: "{{ conda_location }}/envs"
conda_env_file: environment.yml
conda_env_use_spec: false
# New explicit specs should use the platform-specific filename. Repositories
# that still provide spec-list.txt can override this variable for compatibility.
conda_env_spec_file: linux-64.spec
wps_conda_channel: conda-forge
wps_conda_packages:
  - gunicorn
  - gevent
  - psycopg2=2.9.12
  - drmaa=0.7.9
  - dill
  - pytest
  - pytest-cov
wps_pip_packages: []

# supervisor
# https://github.com/geerlingguy/ansible-role-supervisor
supervisor_user: root
supervisor_password: 'test'
supervisor_unix_http_server_password_protect: false
supervisor_inet_http_server_password_protect: false
supervisor_unix_http_server_enable: true
supervisor_inet_http_server_enable: false
supervisor_inet_http_server_port: '*:9001'

# nginx
# https://galaxy.ansible.com/ui/standalone/roles/geerlingguy/nginx/
# https://galaxy.ansible.com/ui/standalone/roles/nginxinc/nginx/
nginx_user: "{{ service_user }} {{ service_group }}"
nginx_remove_default_vhost: true
nginx_extra_http_options: |
  types {
    application/x-netcdf    nc;
    application/ncML+xml    ncml;
  }
nginx_keepalive_timeout: "60"
nginx_keepalive_requests: "100"
nginx_proxy_timeout: "60s"

# ssl
ssl_certs_common_name: "{{ ansible_fqdn }}"
ssl_certs_path: "/etc/ssl/{{ ssl_certs_common_name }}"
ssl_certs_privkey_path: "{{ ssl_certs_path }}/{{ ssl_certs_common_name }}.key"
ssl_certs_cert_path: "{{ ssl_certs_path }}/{{ ssl_certs_common_name }}.pem"

# gunicorn
# https://docs.gunicorn.org/en/stable/settings.html
gunicorn_workers: 9  # rule of thumb: 2 * CPUs + 1
gunicorn_worker_connections: 1000
gunicorn_worker_class: 'gevent'  # "sync" or "gevent", needs gevent
gunicorn_timeout: 30
gunicorn_graceful_timeout: "{{ gunicorn_timeout }}"
gunicorn_max_requests: 1000
gunicorn_max_requests_jitter: 100
gunicorn_cleanup_orphaned_processes: false

# postgres
# https://github.com/geerlingguy/ansible-role-postgresql
postgresql_restarted_state: "restarted"
postgresql_service_state: "started"
postgresql_service_enabled: true
postgresql_locales:
  - 'en_US.utf8'
postgresql_databases:
  - name:  "pywps"
    port: "{{ db_port }}"
postgresql_users:
  - name: "{{ db_user }}"
    password: "{{ db_password }}"
    encrypted: yes  # encryption necessary for postgres>=10.0.
# postgresql_hba_entries: []

# cron
cron_enabled: false
cron_disabled: "{{ cron_enabled | bool == false }}"
cron_mailto: root
cron_user: root
wps_restart_enabled: true
wps_restart_schedule: daily
# Rotate PyWPS logs after one day only when they exceed this size.
wps_logrotate_min_size: 10M
wps_logrotate_rotations: 7
# Report stalled requests without changing them.
wps_job_control_monitor_enabled: true
# Allow commands that recover stalled requests or status documents.
wps_job_control_recovery_enabled: false
# Write a complete hourly job statistics report.
wps_job_statistics_enabled: true
wps_job_statistics_schedule:
  minute: "4"
  hour: "*"
  day: "*"
  month: "*"
  weekday: "*"
wps_job_control_schedule:
  minute: "*/5"
  hour: "*"
  day: "*"
  month: "*"
  weekday: "*"
wps_job_control_recovery_schedule:
  minute: "1-56/5"
  hour: "*"
  day: "*"
  month: "*"
  weekday: "*"
# Warn about non-final database requests running this long.
wps_job_control_long_running_minutes: "{{ job_long_running_minutes }}"
wps_job_control_stale_after_minutes: 120
wps_job_control_database_stale_after_minutes: 120
# Maximum recovered jobs per layer.
wps_job_control_recovery_limit: 100
# Preserve failed status documents separately from routine output cleanup.
wps_job_incident_archive_enabled: true
wps_job_incident_archive_dir: "{{ service_user_home }}/job-incidents"
wps_job_incident_keep_days: 30
wps_job_incident_keep_minutes: "{{ (wps_job_incident_keep_days | int) * 1440 }}"
# Create failure XML for repeated Nginx 404 status polling.
wps_missing_status_recovery_enabled: false
wps_missing_status_poll_window_minutes: 180
wps_missing_status_min_poll_count: 3
wps_missing_status_min_poll_duration_minutes: 150
wps_missing_status_recovery_limit: 20
wps_missing_status_access_log: "{{ wps_http_log_dir }}/access.log"
wps_missing_status_database_guard: true

# selinux
# https://docs.ansible.com/ansible/latest/collections/community/general/sefcontext_module.html
selinux_enabled: true

# roocs
roocs_enabled: false
roocs_site: demo
roocs_demo_data_dir: /data
roocs_cache_dir: "/tmp/inventory_cache"

# pywps
wps_user: "{{ service_user }}"
wps_group: "{{ service_group }}"
wps_enable_https: false
wps_enable_acl: false
wps_acl_allow: []
wps_run_dir: /run/pywps
wps_database: "postgresql+psycopg2://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/pywps"
wps_webservice_enabled: true
wps_basedir: "{{ service_user_home }}"
wps_cache_dir: "{{ wps_basedir }}/cache"
# Cache WPS GetCapabilities and DescribeProcess responses.
wps_cache_valid: "10m"
# Keep health checks fresh while shielding WPS from load-balancer request volume.
wps_health_cache_valid: "30s"
wps_log_dir: /var/log/pywps
wps_http_log_dir: /var/log/nginx
wps_outputs_keep_hours: 12
wps_outputs_keep_minutes: "{{ (wps_outputs_keep_hours | int) * 60 }}"
wps_temp_keep_hours: 12
wps_temp_keep_minutes: "{{ (wps_temp_keep_hours | int) * 60 }}"
wps_services: []
  # - name: emu
  #   repo: https://github.com/bird-house/emu.git
  #   version: master
  #   hostname: "{{ server_name }}"
  #   port: 5000
  #   maxsingleinputsize: 200mb
  #   maxrequestsize: 200mb
  #   maxprocesses: 30
  #   parallelprocesses: 4
  #   mode: default
  #   drmaa_native_specification: ""
  #   log_level: INFO
  #   cleantempdir: true
  #   storage_copy_function: copy
  #   database: "{{ wps_database }}"
