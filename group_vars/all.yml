---
# Variables listed here are applicable to all host groups
prefix: /usr/local
src_dir: "{{ prefix }}/src"
server_name: localhost
service_add_user: true
service_user: wps
# service_uid: 500
service_group: "{{ service_user }}"
service_groups: "{{ service_group }}"
# service_gid: 100
service_user_home: /var/lib/pywps
wps_tools_state_dir: "{{ service_user_home }}/state"
wps_tools_dir: /opt/wps-tools
wps_tools_bin_dir: "{{ wps_tools_dir }}/bin"
wps_tools_sbin_dir: "{{ wps_tools_dir }}/sbin"
wps_tools_script_dir: "{{ wps_tools_dir }}/scripts"
# Standard operator PATH location for symlinks to routine, read-only commands.
wps_tools_path_dir: /usr/local/sbin
wps_tools_statistics_dir: "{{ service_user_home }}/statistics"
wps_tools_event_keep_days: 42
# Zero keeps daily aggregate rows indefinitely.
wps_tools_statistics_keep_days: 0
# Compact interactive PyWPS database overview.
wps_tools_pywps_status_script: "{{ wps_tools_script_dir }}/pywps-job-status.py"
wps_tools_pywps_top_script: "{{ wps_tools_bin_dir }}/ptop"
wps_tools_infrastructure_status_script: >-
  {{ wps_tools_script_dir }}/infrastructure-status.py
wps_tools_infrastructure_top_script: "{{ wps_tools_bin_dir }}/itop"

# collectd host monitoring (Red Hat family version 9 only)
collectd_enabled: true
collectd_hostname: localhost
collectd_interval: 60
collectd_csv_dir: /var/lib/collectd/csv
collectd_load_enabled: true
collectd_disk_enabled: false
collectd_disk_mount: /mnt/ext_pywps_outputs
collectd_memory_enabled: true
collectd_interface_enabled: true
collectd_interface: "{{ ansible_default_ipv4.interface | default('eth0') }}"
collectd_cleanup_enabled: true
collectd_cleanup_script: /usr/local/sbin/collectd-cleanup
collectd_cleanup_schedule: "*-*-* 00:30:00"
collectd_compress_after_days: 7
collectd_keep_days: 30
collectd_summary_enabled: true
collectd_summary_script: /usr/local/sbin/collectd-daily-summary
collectd_summary_schedule: "*-*-* 00:10:00"
collectd_summary_output_dir: /var/log
collectd_summary_output: "{{ collectd_summary_output_dir }}/collectd-daily-summary.log"
collectd_hourly_summary_enabled: true
collectd_hourly_summary_schedule: "*-*-* *:05:00"
collectd_hourly_summary_output: >-
  {{ collectd_summary_output_dir }}/collectd-hourly-summary.log

# postgres
db_install_postgresql: true
db_install_sqlite: false
db_host: localhost
db_port: 5432
db_user: pywps
db_password: pywps

# Web-service configuration paths are defined here as well as by the upstream
# roles so focused tagged updates do not depend on their installation tasks.
nginx_conf_path: /etc/nginx/conf.d
supervisor_config_path: /etc/supervisor

# nginx fileserver
fs_enabled: false
fs_host: localhost
fs_port: 6000

# Shared hard job timeout and recovery grace period. Slurm enforces the timeout;
# XML, database, and missing-status recovery settings below derive from both.
job_timeout_minutes: 90
job_timeout_grace_minutes: 5
# Shared long-running warning. WPS and Slurm inherit this value but remain
# independently overridable in deployment inventories.
job_long_running_minutes: 10

# Shared processing capacity. "auto" uses the logical CPU count reported by
# Ansible. Set a positive integer to advertise less capacity, or override the
# derived Slurm and Gunicorn settings independently below.
wps_cpus: auto
wps_cpus_resolved: >-
  {{
    (ansible_processor_vcpus
     | default(ansible_processor_nproc)
     | default(ansible_processor_count)
     | default(1))
    if (wps_cpus | string | lower) == 'auto'
    else (wps_cpus | int)
  }}
# Keep capacity for Gunicorn and other host services instead of advertising
# every CPU to Slurm. "auto" reserves one CPU on hosts with up to four CPUs
# and two CPUs on larger hosts, while always leaving Slurm at least one CPU.
wps_service_cpus: auto
wps_service_cpus_resolved: >-
  {{
    (
      [
        (2 if (wps_cpus_resolved | int) > 4 else 1),
        ([(wps_cpus_resolved | int) - 1, 0] | max)
      ] | min
    )
    if (wps_service_cpus | string | lower) == 'auto'
    else (wps_service_cpus | int)
  }}

# slurm/drmaa
# https://github.com/galaxyproject/ansible-slurm
slurm_enabled: false
# Keep host services outside Slurm's allocatable memory. Automatic CPU/job
# capacity also leaves at least this much allocatable RAM per concurrent job.
slurm_system_memory_reserve_percent: 20
slurm_min_job_memory_mb: 4096
slurm_real_memory_mb: >-
  {{
    ((ansible_memtotal_mb | int)
     * (100 - (slurm_system_memory_reserve_percent | int)) / 100) | int
  }}
slurm_cpus: >-
  {{
    [
      [
        (wps_cpus_resolved | int) - (wps_service_cpus_resolved | int),
        (slurm_real_memory_mb | int) // (slurm_min_job_memory_mb | int)
      ] | min,
      1
    ] | max
  }}
slurm_drmaa_version: 1.1.4
slurm_roles: ['controller', 'exec']
# Jobs receive an equal share by default. Memory-heavy deployments can raise
# the per-job allocation and let Slurm run fewer jobs concurrently.
slurm_default_job_memory_mb: >-
  {{
    [
      (
        (slurm_real_memory_mb | int)
        // ([slurm_cpus | int, 1] | max)
      ),
      1
    ] | max
  }}
slurm_max_job_memory_mb: "{{ slurm_real_memory_mb }}"
slurm_config:
  JobAcctGatherType: "jobacct_gather/cgroup"
  ProctrackType: "proctrack/cgroup"
  SchedulerType: "sched/backfill"
  SelectType: "select/cons_res"
  SelectTypeParameters: "CR_Core_Memory"
  TaskPlugin: "task/affinity,task/cgroup"
slurm_cgroup_config:
  AllowedRAMSpace: 100
  AllowedSwapSpace: 0
  ConstrainCores: true
  ConstrainRAMSpace: true
  ConstrainSwapSpace: true
slurm_nodes:
  - name: localhost
    CPUs: "{{ slurm_cpus }}"
    RealMemory: "{{ slurm_real_memory_mb }}"
slurm_partitions:
  - name: fast
    Default: YES
    DefaultTime: "{{ slurm_job_timeout_minutes }}"
    DefMemPerNode: "{{ slurm_default_job_memory_mb }}"
    MaxMemPerNode: "{{ slurm_max_job_memory_mb }}"
    MaxTime: "{{ slurm_job_timeout_minutes }}"
    Nodes: localhost
slurm_munge_key: /etc/munge/munge.key
# The local prerequisite role creates the key and manages the Munge service.
slurm_configure_munge: false
# Slurm limits running allocation time; pending queue time is not counted.
slurm_job_timeout_minutes: "{{ job_timeout_minutes }}"
# Optional host-wide Slurm queue and availability alerting. qtop and Slurm's
# hard job limits remain available when this scheduled monitor is disabled.
wps_tools_slurm_monitor_enabled: false
wps_tools_slurm_monitor_schedule:
  minute: "*/5"
  hour: "*"
  day: "*"
  month: "*"
  weekday: "*"
wps_tools_slurm_monitor_user: "{{ wps_user }}"
# Warn well before Slurm reaches the hard timeout.
wps_tools_slurm_monitor_long_running_minutes: "{{ job_long_running_minutes }}"
wps_tools_slurm_monitor_pending_critical: 20
wps_tools_slurm_monitor_script: "{{ wps_tools_script_dir }}/slurm-job-monitor.py"
wps_tools_slurm_monitor_lock_file: /run/lock/slurm-job-monitor.lock
wps_tools_slurm_monitor_log_file: "{{ wps_log_dir }}/slurm-job-monitor.log"
wps_tools_slurm_monitor_alert_file: "{{ wps_run_dir }}/slurm-red-alert.json"
# Small interactive Slurm queue overview.
wps_tools_slurm_status_script: "{{ wps_tools_script_dir }}/slurm-job-status.py"
wps_tools_slurm_top_script: "{{ wps_tools_bin_dir }}/qtop"

# miniconda: we need to use Miniforge! See extra_vars.yml
miniconda_parent_dir: "{{ prefix }}"
miniconda_make_sys_default: False
miniconda_pkg_update: false

# conda
conda_location: "{{ prefix }}/anaconda"
conda_bin: "{{ conda_location }}/bin/conda"
conda_envs_dir: "{{ conda_location }}/envs"
conda_env_file: environment.yml
conda_env_use_spec: false
# New explicit specs should use the platform-specific filename. Repositories
# that still provide spec-list.txt can override this variable for compatibility.
conda_env_spec_file: linux-64.spec
wps_conda_channel: conda-forge
wps_conda_packages:
  - gunicorn
  - gevent
  - psycopg2=2.9.12
  - drmaa=0.7.9
  - dill
  - pytest
  - pytest-cov
wps_pip_packages: []

# supervisor
# https://github.com/geerlingguy/ansible-role-supervisor
supervisor_user: root
supervisor_password: 'test'
supervisor_unix_http_server_password_protect: false
supervisor_inet_http_server_password_protect: false
supervisor_unix_http_server_enable: true
supervisor_inet_http_server_enable: false
supervisor_inet_http_server_port: '*:9001'

# nginx
# https://galaxy.ansible.com/ui/standalone/roles/geerlingguy/nginx/
# https://galaxy.ansible.com/ui/standalone/roles/nginxinc/nginx/
nginx_user: "{{ service_user }} {{ service_group }}"
nginx_remove_default_vhost: true
nginx_extra_http_options: |
  types {
    application/x-netcdf    nc;
    application/ncML+xml    ncml;
  }
nginx_keepalive_timeout: "60"
nginx_keepalive_requests: "100"
nginx_proxy_timeout: "60s"

# ssl
ssl_certs_common_name: "{{ ansible_fqdn }}"
ssl_certs_path: "/etc/ssl/{{ ssl_certs_common_name }}"
ssl_certs_privkey_path: "{{ ssl_certs_path }}/{{ ssl_certs_common_name }}.key"
ssl_certs_cert_path: "{{ ssl_certs_path }}/{{ ssl_certs_common_name }}.pem"

# gunicorn
# https://docs.gunicorn.org/en/stable/settings.html
gunicorn_workers: "{{ (wps_cpus_resolved | int) * 2 + 1 }}"
gunicorn_worker_connections: 1000
gunicorn_worker_class: 'gevent'  # "sync" or "gevent", needs gevent
gunicorn_timeout: 30
gunicorn_graceful_timeout: "{{ gunicorn_timeout }}"
gunicorn_max_requests: 1000
gunicorn_max_requests_jitter: 100
gunicorn_cleanup_orphaned_processes: false

# postgres
# https://github.com/geerlingguy/ansible-role-postgresql
postgresql_restarted_state: "restarted"
postgresql_service_state: "started"
postgresql_service_enabled: true
postgresql_locales:
  - 'en_US.utf8'
postgresql_databases:
  - name:  "pywps"
    port: "{{ db_port }}"
postgresql_users:
  - name: "{{ db_user }}"
    password: "{{ db_password }}"
    encrypted: yes  # encryption necessary for postgres>=10.0.
# postgresql_hba_entries: []

# cron
cron_enabled: false
cron_disabled: "{{ cron_enabled | bool == false }}"
cron_mailto: root
cron_user: root
wps_tools_restart_enabled: false
wps_tools_restart_schedule: daily
# Rotate PyWPS logs after one day only when they exceed this size.
wps_logrotate_min_size: 10M
wps_logrotate_rotations: 7
# Report stalled requests without changing them.
wps_tools_job_control_monitor_enabled: true
# Allow commands that recover stalled requests or status documents.
wps_tools_job_control_recovery_enabled: true
# Write a complete hourly job statistics report.
wps_tools_statistics_enabled: true
wps_tools_statistics_schedule:
  minute: "4"
  hour: "*"
  day: "*"
  month: "*"
  weekday: "*"
# Record completed status XML every five minutes, including before hourly cleanup.
wps_tools_inspect_enabled: true
wps_tools_inspect_schedule:
  minute: "2-57/5"
  hour: "*"
  day: "*"
  month: "*"
  weekday: "*"
wps_tools_job_control_schedule:
  minute: "*/5"
  hour: "*"
  day: "*"
  month: "*"
  weekday: "*"
wps_tools_job_control_recovery_schedule:
  minute: "1-56/5"
  hour: "*"
  day: "*"
  month: "*"
  weekday: "*"
# Warn about started database requests running this long; queue wait is excluded.
wps_tools_job_control_long_running_minutes: "{{ job_long_running_minutes }}"
wps_tools_job_control_stale_after_minutes: >-
  {{ (job_timeout_minutes | int) + (job_timeout_grace_minutes | int) }}
wps_tools_job_control_database_stale_after_minutes: >-
  {{ (job_timeout_minutes | int) + (job_timeout_grace_minutes | int) }}
# Accepted rows may represent queue wait, so use a separate conservative age.
wps_tools_job_control_database_accepted_stale_after_hours: 24
# Report the status mix for jobs started in this recent window.
wps_tools_job_control_database_status_window_hours: 24
# Maximum recovered jobs per layer.
wps_tools_job_control_recovery_limit: 100
# Preserve failed status documents separately from routine output cleanup.
wps_tools_incident_archive_enabled: true
wps_tools_incident_archive_dir: "{{ service_user_home }}/job-incidents"
wps_tools_incident_keep_days: 30
wps_tools_incident_keep_minutes: "{{ (wps_tools_incident_keep_days | int) * 1440 }}"
# Create failure XML for repeated Nginx 404 status polling.
wps_tools_missing_status_recovery_enabled: true
wps_tools_missing_status_poll_window_minutes: >-
  {{ ((job_timeout_minutes | int) * 2)
     + ((job_timeout_grace_minutes | int) * 2) }}
wps_tools_missing_status_min_poll_count: 3
wps_tools_missing_status_min_poll_duration_minutes: >-
  {{ (job_timeout_minutes | int)
     + ((job_timeout_grace_minutes | int) * 2) }}
wps_tools_missing_status_recovery_limit: 20
wps_tools_missing_status_access_log: "{{ wps_http_log_dir }}/access.log"
wps_tools_missing_status_database_guard: true

# selinux
# https://docs.ansible.com/ansible/latest/collections/community/general/sefcontext_module.html
selinux_enabled: true

# roocs
roocs_enabled: false

# pywps
wps_user: "{{ service_user }}"
wps_group: "{{ service_group }}"
wps_enable_https: false
wps_enable_acl: false
wps_acl_allow: []
wps_run_dir: /run/pywps
wps_database: "postgresql+psycopg2://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/pywps"
wps_webservice_enabled: true
wps_basedir: "{{ service_user_home }}"
wps_cache_dir: "{{ wps_basedir }}/cache"
# Cache WPS GetCapabilities and DescribeProcess responses.
wps_cache_valid: "10m"
# Keep health checks fresh while shielding WPS from load-balancer request volume.
wps_health_cache_valid: "30s"
wps_log_dir: /var/log/pywps
wps_http_log_dir: /var/log/nginx
wps_outputs_keep_hours: 6
wps_outputs_keep_minutes: "{{ (wps_outputs_keep_hours | int) * 60 }}"
wps_temp_keep_hours: 6
wps_temp_keep_minutes: "{{ (wps_temp_keep_hours | int) * 60 }}"
wps_services: []
  # - name: emu
  #   repo: https://github.com/bird-house/emu.git
  #   version: master
  #   hostname: "{{ server_name }}"
  #   port: 5000
  #   maxsingleinputsize: 200mb
  #   maxrequestsize: 200mb
  #   maxprocesses: 30
  #   parallelprocesses: 4
  #   mode: default
  #   drmaa_native_specification: ""
  #   log_level: INFO
  #   cleantempdir: true
  #   storage_copy_function: copy
  #   database: "{{ wps_database }}"
  #   # outputurl: http://somewhere.earth/outputs # optional
  #   extra_config: |
  #     [data]
  #     cache_path = /tmp
